<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
<style>
.out{fill:#fffaf7;stroke:#4b2c1f;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.tail{fill:#5a3428;stroke:#4b2c1f;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.eye{fill:#4b2c1f}.eye-open{fill:#fff;stroke:#4b2c1f;stroke-width:4}
.eye-smile,.mouth-line{fill:none;stroke:#4b2c1f;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.beak{fill:#8b5643;stroke:#4b2c1f;stroke-width:2}.beak-open{fill:#8b5643;stroke:#4b2c1f;stroke-width:3}
.blush{fill:#ffd6cd;opacity:.85}.feet{fill:none;stroke:#4b2c1f;stroke-width:4;stroke-linecap:round}
.feather{fill:none;stroke:#4b2c1f;stroke-width:4;stroke-linecap:round}
.icon.info{fill:#5b91d9}.icon.advice{fill:#63ad62}.icon.motivation{fill:#ffbf45;stroke:#e49a1c;stroke-width:3}.icon.warning{fill:#ff7b86}
.icon-text{fill:white;font:bold 23px sans-serif;text-anchor:middle}.icon-line{fill:none;stroke:white;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.question{fill:#6d8dc8;font:bold 42px sans-serif}.bubble{fill:#eaf4ff;stroke:#8fb5e8;stroke-width:3}
.shock-lines{fill:none;stroke:#8b8ed4;stroke-width:5;stroke-linecap:round}
.book-small{fill:#3d70b2;stroke:#24446d;stroke-width:3}.book-text{fill:white;font:bold 16px serif;text-anchor:middle}
.heart{fill:#ff9aa6}.zzz{fill:#7d9cc8;font:bold 23px sans-serif}
</style>
