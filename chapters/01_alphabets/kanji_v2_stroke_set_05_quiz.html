nation": "駅: 馬 a sinistra, 尺 a destra."}, {"prompt": "Quale kanji ha questo significato?", "focus": "negozio", "options": ["店", "学", "校", "先"], "answer": 0, "explanation": "店 = negozio."}, {"prompt": "Quanti tratti ha questo kanji?", "focus": "店", "options": ["8", "5", "6", "10"], "answer": 0, "explanation": "店 ha 8 tratti."}, {"prompt": "Qual è il primo tratto?", "focus": "店", "options": ["punto alto", "punto sinistro", "木 orizzontale", "tratto alto"], "answer": 0, "explanation": "Primo tratto di 店: punto alto."}, {"prompt": "Scegli il significato corretto.", "focus": "店", "options": ["negozio", "studio / imparare", "scuola", "prima / precedente"], "answer": 0, "explanation": "店 = negozio."}, {"prompt": "Quale kanji segue questa logica?", "focus": "广 sopra/sinistra, 占 sotto", "options": ["店", "学", "校", "先"], "answer": 0, "explanation": "店: 广 sopra/sinistra, 占 sotto."}, {"prompt": "Quale kanji ha questo significato?", "focus": "casa / famiglia", "options": ["家", "校", "先", "生"], "answer": 0, "explanation": "家 = casa / famiglia."}, {"prompt": "Quanti tratti ha questo kanji?", "focus": "家", "options": ["10", "5", "6", "8"], "answer": 0, "explanation": "家 ha 10 tratti."}, {"prompt": "Qual è il primo tratto?", "focus": "家", "options": ["punto alto", "punto sinistro", "木 orizzontale", "tratto alto"], "answer": 0, "explanation": "Primo tratto di 家: punto alto."}, {"prompt": "Scegli il significato corretto.", "focus": "家", "options": ["casa / famiglia", "scuola", "prima / precedente", "vita / nascere"], "answer": 0, "explanation": "家 = casa / famiglia."}, {"prompt": "Quale kanji segue questa logica?", "focus": "宀 sopra, interno sotto", "options": ["家", "校", "先", "生"], "answer": 0, "explanation": "家: 宀 sopra, interno sotto."}, {"prompt": "Quale kanji ha questo significato?", "focus": "fuori / esterno", "options": ["外", "先", "生", "本"], "answer": 0, "explanation": "外 = fuori / esterno."}, {"prompt": "Quanti tratti ha questo kanji?", "focus": "外", "options": ["5", "6", "8", "10"], "answer": 0, "explanation": "外 ha 5 tratti."}, {"prompt": "Qual è il primo tratto?", "focus": "外", "options": ["夕 alto", "punto sinistro", "木 orizzontale", "tratto alto"], "answer": 0, "explanation": "Primo tratto di 外: 夕 alto."}, {"prompt": "Scegli il significato corretto.", "focus": "外", "options": ["fuori / esterno", "prima / precedente", "vita / nascere", "libro / origine"], "answer": 0, "explanation": "外 = fuori / esterno."}, {"prompt": "Quale kanji segue questa logica?", "focus": "夕 a sinistra, 卜 a destra", "options": ["外", "先", "生", "本"], "answer": 0, "explanation": "外: 夕 a sinistra, 卜 a destra."}];
function shuffle(array){const arr=[...array];for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}

function shimaQuestionKey(item) {
  return JSON.stringify({
    prompt: item && item.prompt || '',
    focus: item && item.focus || '',
    options: item && item.options || [],
    answer: item && item.answer,
    explanation: item && item.explanation || ''
  });
}
function uniqueQuestions(pool) {
  const seen = new Set();
  return (pool || []).filter(item => {
    const key = shimaQuestionKey(item);
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}

let currentQuestions=[];
function renderQuiz(){currentQuestions=shuffle(uniqueQuestions(QUESTION_POOL)).slice(0,10).map(item=>{const options=shuffle(item.options.map((text,idx)=>({text,originalIndex:idx})));return {...item,shuffledOptions:options,correctShuffledIndex:options.findIndex(o=>o.originalIndex===item.answer)};});const form=document.getElementById('quizForm');form.innerHTML=currentQuestions.map((item,idx)=>{const name='q'+idx;const options=item.shuffledOptions.map((choice,cidx)=>`<label class="quiz-option"><input type="radio" name="${name}" value="${cidx}"><span>${choice.text}</span></label>`).join('');return `<section class="print-section quiz-question-card"><h2>Domanda ${idx+1}</h2><p class="quiz-question-main">${item.prompt}</p><div class="quiz-question-focus kanji-v2-quiz-focus">${item.focus}</div><div class="quiz-options">${options}</div><div class="quiz-inline-feedback" id="fb${idx}"></div></section>`;}).join('');document.getElementById('quizResult').innerHTML='';window.scrollTo({top:0,behavior:'smooth'});}
function checkQuiz(){let correct=0;currentQuestions.forEach((item,idx)=>{const picked=document.querySelector(`input[name="q${idx}"]:checked`);const fb=document.getElementById('fb'+idx);if(picked&&Number(picked.value)===item.correctShuffledIndex){correct++;fb.innerHTML=`<strong class="ok">Corretto.</strong> ${item.explanation}`;}else{fb.innerHTML=`<strong class="ko">Soluzione:</strong> ${item.shuffledOptions[item.correctShuffledIndex].text}<br>${item.explanation}`;}});document.getElementById('quizResult').innerHTML=`<strong>Risultato:</strong> ${correct} / 10 corrette.`;}
document.getElementById('reloadQuizBtn').addEventListener('click',renderQuiz);document.getElementById('checkBtn').addEventListener('click',checkQuiz);renderQuiz();</script></body></html>
