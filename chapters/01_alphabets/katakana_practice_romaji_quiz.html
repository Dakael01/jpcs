on": "ra si scrive ラ."}, {"prompt": "Quale katakana corrisponde a questo romaji?", "focus": "ri", "options": ["リ", "オ", "カ", "キ"], "answer": 0, "explanation": "ri si scrive リ."}, {"prompt": "Quale katakana corrisponde a questo romaji?", "focus": "ru", "options": ["ル", "カ", "キ", "ク"], "answer": 0, "explanation": "ru si scrive ル."}, {"prompt": "Quale katakana corrisponde a questo romaji?", "focus": "re", "options": ["レ", "キ", "ク", "ケ"], "answer": 0, "explanation": "re si scrive レ."}, {"prompt": "Quale katakana corrisponde a questo romaji?", "focus": "ro", "options": ["ロ", "ア", "イ", "ウ"], "answer": 0, "explanation": "ro si scrive ロ."}, {"prompt": "Quale katakana corrisponde a questo romaji?", "focus": "wa", "options": ["ワ", "イ", "ウ", "エ"], "answer": 0, "explanation": "wa si scrive ワ."}, {"prompt": "Quale katakana corrisponde a questo romaji?", "focus": "wo / o", "options": ["ヲ", "ウ", "エ", "オ"], "answer": 0, "explanation": "wo / o si scrive ヲ."}, {"prompt": "Quale katakana corrisponde a questo romaji?", "focus": "n", "options": ["ン", "エ", "オ", "カ"], "answer": 0, "explanation": "n si scrive ン."}, {"prompt": "Quale katakana corrisponde a questo romaji?", "focus": "ga", "options": ["ガ", "オ", "カ", "キ"], "answer": 0, "explanation": "ga si scrive ガ."}, {"prompt": "Quale katakana corrisponde a questo romaji?", "focus": "gi", "options": ["ギ", "カ", "キ", "ク"], "answer": 0, "explanation": "gi si scrive ギ."}, {"prompt": "Quale katakana corrisponde a questo romaji?", "focus": "gu", "options": ["グ", "キ", "ク", "ケ"], "answer": 0, "explanation": "gu si scrive グ."}, {"prompt": "Quale katakana corrisponde a questo romaji?", "focus": "ge", "options": ["ゲ", "ア", "イ", "ウ"], "answer": 0, "explanation": "ge si scrive ゲ."}];
function shuffle(array) {
  const arr = [...array];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function shimaQuestionKey(item) {
  return JSON.stringify({
    prompt: item && item.prompt || '',
    focus: item && item.focus || '',
    options: item && item.options || [],
    answer: item && item.answer,
    explanation: item && item.explanation || ''
  });
}
function uniqueQuestions(pool) {
  const seen = new Set();
  return (pool || []).filter(item => {
    const key = shimaQuestionKey(item);
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}

let currentQuestions = [];
function renderQuiz() {
  currentQuestions = shuffle(uniqueQuestions(QUESTION_POOL)).slice(0, 10).map(item => {
    const options = shuffle(item.options.map((text, idx) => ({ text, originalIndex: idx })));
    return {...item, shuffledOptions: options, correctShuffledIndex: options.findIndex(o => o.originalIndex === item.answer)};
  });
  const form = document.getElementById('quizForm');
  form.innerHTML = currentQuestions.map((item, idx) => {
    const name = 'q' + idx;
    const options = item.shuffledOptions.map((choice, cidx) => `
      <label class="quiz-option">
        <input type="radio" name="${name}" value="${cidx}">
        <span>${choice.text}</span>
      </label>`).join('');
    return `
      <section class="print-section quiz-question-card">
        <h2>Domanda ${idx + 1}</h2>
        <p class="quiz-question-main">${item.prompt}</p>
        <div class="quiz-question-focus kana-quiz-focus">${item.focus}</div>
        <div class="quiz-options">${options}</div>
        <div class="quiz-inline-feedback" id="fb${idx}"></div>
      </section>`;
  }).join('');
  document.getElementById('quizResult').innerHTML = '';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function checkQuiz() {
  let correct = 0;
  currentQuestions.forEach((item, idx) => {
    const picked = document.querySelector(`input[name="q${idx}"]:checked`);
    const fb = document.getElementById('fb' + idx);
    if (picked && Number(picked.value) === item.correctShuffledIndex) {
      correct++;
      fb.innerHTML = `<strong class="ok">Corretto.</strong> ${item.explanation}`;
    } else {
      fb.innerHTML = `<strong class="ko">Soluzione:</strong> ${item.shuffledOptions[item.correctShuffledIndex].text}<br>${item.explanation}`;
    }
  });
  document.getElementById('quizResult').innerHTML = `<strong>Risultato:</strong> ${correct} / 10 corrette.`;
}
document.getElementById('reloadQuizBtn').addEventListener('click', renderQuiz);
document.getElementById('checkBtn').addEventListener('click', checkQuiz);
renderQuiz();
