": "四 = quattro."}, {"prompt": "Scegli il significato corretto.", "focus": "五", "options": ["cinque", "risaia / campo", "cielo / vuoto", "pioggia"], "answer": 0, "explanation": "五 = cinque."}, {"prompt": "Scegli il significato corretto.", "focus": "六", "options": ["sei", "cielo / vuoto", "pioggia", "persona"], "answer": 0, "explanation": "六 = sei."}, {"prompt": "Scegli il significato corretto.", "focus": "七", "options": ["sette", "pioggia", "persona", "donna"], "answer": 0, "explanation": "七 = sette."}, {"prompt": "Scegli il significato corretto.", "focus": "八", "options": ["otto", "persona", "donna", "uomo"], "answer": 0, "explanation": "八 = otto."}, {"prompt": "Scegli il significato corretto.", "focus": "九", "options": ["nove", "donna", "uomo", "bambino"], "answer": 0, "explanation": "九 = nove."}, {"prompt": "Scegli il significato corretto.", "focus": "十", "options": ["dieci", "uomo", "bambino", "occhio"], "answer": 0, "explanation": "十 = dieci."}, {"prompt": "Scegli il significato corretto.", "focus": "年", "options": ["anno", "bambino", "occhio", "bocca"], "answer": 0, "explanation": "年 = anno."}, {"prompt": "Scegli il significato corretto.", "focus": "時", "options": ["ora / tempo", "occhio", "bocca", "orecchio"], "answer": 0, "explanation": "時 = ora / tempo."}, {"prompt": "Scegli il significato corretto.", "focus": "分", "options": ["minuto / parte / capire", "bocca", "orecchio", "mano"], "answer": 0, "explanation": "分 = minuto / parte / capire."}, {"prompt": "Scegli il significato corretto.", "focus": "今", "options": ["adesso", "orecchio", "mano", "piede / gamba"], "answer": 0, "explanation": "今 = adesso."}, {"prompt": "Scegli il significato corretto.", "focus": "前", "options": ["prima / davanti", "sole / giorno", "luna / mese", "fuoco"], "answer": 0, "explanation": "前 = prima / davanti."}, {"prompt": "Scegli il significato corretto.", "focus": "後", "options": ["dopo / dietro", "luna / mese", "fuoco", "acqua"], "answer": 0, "explanation": "後 = dopo / dietro."}, ons": ["negozio", "bambino", "occhio", "bocca"], "answer": 0, "explanation": "店 = negozio."}, {"prompt": "Scegli il significato corretto.", "focus": "家", "options": ["casa / famiglia", "occhio", "bocca", "orecchio"], "answer": 0, "explanation": "家 = casa / famiglia."}, {"prompt": "Scegli il significato corretto.", "focus": "外", "options": ["fuori / esterno", "bocca", "orecchio", "mano"], "answer": 0, "explanation": "外 = fuori / esterno."}];
function shuffle(array) {
  const arr = [...array];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function shimaQuestionKey(item) {
  return JSON.stringify({
    prompt: item && item.prompt || '',
    focus: item && item.focus || '',
    options: item && item.options || [],
    answer: item && item.answer,
    explanation: item && item.explanation || ''
  });
}
function uniqueQuestions(pool) {
  const seen = new Set();
  return (pool || []).filter(item => {
    const key = shimaQuestionKey(item);
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}

let currentQuestions = [];
function renderQuiz() {
  currentQuestions = shuffle(uniqueQuestions(QUESTION_POOL)).slice(0, 10).map(item => {
    const options = shuffle(item.options.map((text, idx) => ({ text, originalIndex: idx })));
    return {...item, shuffledOptions: options, correctShuffledIndex: options.findIndex(o => o.originalIndex === item.answer)};
  });
  const form = document.getElementById('quizForm');
  form.innerHTML = currentQuestions.map((item, idx) => {
    const name = 'q' + idx;
    const options = item.shuffledOptions.map((choice, cidx) => `
      <label class="quiz-option"><input type="radio" name="${name}" value="${cidx}"><span>${choice.text}</span></label>`).join('');
    return `
      <section class="print-section quiz-question-card">
        <h2>Domanda ${idx + 1}</h2>
        <p class="quiz-question-main">${item.prompt}</p>
        <div class="quiz-question-focus kanji-v2-quiz-focus">${item.focus}</div>
        <div class="quiz-options">${options}</div>
        <div class="quiz-inline-feedback" id="fb${idx}"></div>
      </section>`;
  }).join('');
  document.getElementById('quizResult').innerHTML = '';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function checkQuiz() {
  let correct = 0;
  currentQuestions.forEach((item, idx) => {
    const picked = document.querySelector(`input[name="q${idx}"]:checked`);
    const fb = document.getElementById('fb' + idx);
    if (picked && Number(picked.value) === item.correctShuffledIndex) {
      correct++;
      fb.innerHTML = `<strong class="ok">Corretto.</strong> ${item.explanation}`;
    } else {
      fb.innerHTML = `<strong class="ko">Soluzione:</strong> ${item.shuffledOptions[item.correctShuffledIndex].text}<br>${item.explanation}`;
    }
  });
  document.getElementById('quizResult').innerHTML = `<strong>Risultato:</strong> ${correct} / 10 corrette.`;
}
document.getElementById('reloadQuizBtn').addEventListener('click', renderQuiz);
document.getElementById('checkBtn').addEventListener('click', checkQuiz);
renderQuiz();
</script>
