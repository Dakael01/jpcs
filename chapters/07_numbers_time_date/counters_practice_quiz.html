", "choices": ["10.000", "1.000", "100.000", "100"], "answer": 0}, {"q": "ろっぴゃくえん", "prompt": "Qual è la scrittura corretta?", "choices": ["600円", "60円", "6.000円", "16円"], "answer": 0}, {"q": "はっぴゃく", "prompt": "Qual è la scrittura corretta?", "choices": ["800", "8", "80", "8.000"], "answer": 0}, {"q": "せんえん", "prompt": "Qual è la scrittura corretta?", "choices": ["100円", "1.000円", "10.000円", "3.000円"], "answer": 1}, {"q": "いちまんえん", "prompt": "Qual è la scrittura corretta?", "choices": ["1.000円", "10.000円", "100.000円", "10円"], "answer": 1}, {"q": "さんぜんえん", "prompt": "Qual è la scrittura corretta?", "choices": ["300円", "3.000円", "30.000円", "13円"], "answer": 1}, {"q": "五", "prompt": "Che numero è 五?", "choices": ["4", "5", "6", "7"], "answer": 1}, {"q": "八", "prompt": "Che numero è 八?", "choices": ["6", "7", "8", "9"], "answer": 2}, {"q": "九百", "prompt": "Come si legge 900?", "choices": ["きゅうひゃく", "きゅうびゃく", "くひゃく", "きゅびゃく"], "answer": 0}, {"q": "六千", "prompt": "Come si legge 6.000?", "choices": ["ろくせん", "ろくぜん", "ろっせん", "ろくせっ"], "answer": 0}, {"q": "四百", "prompt": "Come si legge 400?", "choices": ["よんひゃく", "しひゃく", "よひゃく", "よんびゃく"], "answer": 0}, {"q": "二十円", "prompt": "Che cosa significa?", "choices": ["20 yen", "200 yen", "2.000 yen", "12 yen"], "answer": 0}, {"q": "全部で三千円です。", "prompt": "Che cosa significa?", "choices": ["In tutto sono 300 yen.", "In tutto sono 3.000 yen.", "In tutto sono 30.000 yen.", "Sono 3 yen."], "answer": 1}, {"q": "二十", "prompt": "Che numero è 二十?", "choices": ["2", "12", "20", "22"], "answer": 2}, {"q": "二十一", "prompt": "Che numero è 二十一?", "choices": ["12", "21", "201", "210"], "answer": 1}, {"q": "四つ", "prompt": "Qual è la lettura corretta?", "choices": ["よっつ", "よんつ", "しつ", "よつ"], "answer": 0}, {"q": "六つ", "prompt": "Qual è la lettura corretta?", "choices": ["ろくつ", "むっつ", "むつ", "ろっつ"], "answer": 1}, {"q": "九つ", "prompt": "Qual è la lettura corretta?", "choices": ["ここのつ", "きゅうつ", "ここつ", "くつ"], "answer": 0}];

function shuffle(array) {
  const arr = [...array];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function pickTen() {
  return shuffle(uniqueQuestions(QUESTION_POOL)).slice(0, 10);
}


function shimaQuestionKey(item) {
  return JSON.stringify({
    prompt: item && item.prompt || '',
    focus: item && item.focus || '',
    options: item && item.options || [],
    answer: item && item.answer,
    explanation: item && item.explanation || ''
  });
}
function uniqueQuestions(pool) {
  const seen = new Set();
  return (pool || []).filter(item => {
    const key = shimaQuestionKey(item);
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}

let currentQuestions = [];

function renderQuiz() {
  currentQuestions = pickTen();
  const form = document.getElementById('quizForm');
  form.innerHTML = currentQuestions.map((item, idx) => {
    const name = 'q' + idx;
    const options = item.choices.map((choice, cidx) => `
      <label class="quiz-option">
        <input type="radio" name="${name}" value="${cidx}">
        <span>${choice}</span>
      </label>
    `).join('');
    return `
      <section class="print-section quiz-question-card">
        <h2>Domanda ${idx + 1}</h2>
        <p class="quiz-question-main">${item.prompt}</p>
        <div class="quiz-question-focus">${item.q}</div>
        <div class="quiz-options">${options}</div>
      </section>
    `;
  }).join('');
  document.getElementById('quizResult').innerHTML = '';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function checkQuiz() {
  let correct = 0;
  currentQuestions.forEach((item, idx) => {
    const picked = document.querySelector(`input[name="q${idx}"]:checked`);
    if (picked && Number(picked.value) === item.answer) correct++;
  });
  const result = document.getElementById('quizResult');
  result.innerHTML = `<strong>Risultato:</strong> ${correct} / 10 corrette.`;
}

document.getElementById('reloadQuizBtn').addEventListener('click', renderQuiz);
document.getElementById('checkBtn').addEventListener('click', checkQuiz);
renderQuiz();
</script>
</body>
