ersone e famiglia", "Casa e oggetti", "Cibo e bevande"], "answer": 0, "explanation": "魚 è nella scheda: Animali."}, {"prompt": "Traduci in italiano.", "focus": "馬", "options": ["cavallo", "insegnante", "studente", "mia madre"], "answer": 0, "explanation": "馬（うま）= cavallo."}, {"prompt": "Scegli la parola giapponese corretta.", "focus": "cavallo", "options": ["馬", "先生", "学生", "母"], "answer": 0, "explanation": "cavallo = 馬（うま）."}, {"prompt": "Qual è la lettura corretta?", "focus": "馬", "options": ["うま", "せんせい", "がくせい", "はは"], "answer": 0, "explanation": "馬 si legge うま."}, {"prompt": "Qual è il romaji corretto?", "focus": "馬", "options": ["uma", "sensei", "gakusei", "haha"], "answer": 0, "explanation": "馬 = uma."}, {"prompt": "A quale categoria appartiene questa parola?", "focus": "馬", "options": ["Animali", "Persone e famiglia", "Casa e oggetti", "Cibo e bevande"], "answer": 0, "explanation": "馬 è nella scheda: Animali."}, {"prompt": "Traduci in italiano.", "focus": "牛", "options": ["mucca / bue", "studente", "mia madre", "mio padre"], "answer": 0, "explanation": "牛（うし）= mucca / bue."}, {"prompt": "Scegli la parola giapponese corretta.", "focus": "mucca / bue", "options": ["牛", "学生", "母", "父"], "answer": 0, "explanation": "mucca / bue = 牛（うし）."}, {"prompt": "Qual è la lettura corretta?", "focus": "牛", "options": ["うし", "がくせい", "はは", "ちち"], "answer": 0, "explanation": "牛 si legge うし."}, {"prompt": "Qual è il romaji corretto?", "focus": "牛", "options": ["ushi", "gakusei", "haha", "chichi"], "answer": 0, "explanation": "牛 = ushi."}, {"prompt": "A quale categoria appartiene questa parola?", "focus": "牛", "options": ["Animali", "Persone e famiglia", "Casa e oggetti", "Cibo e bevande"], "answer": 0, "explanation": "牛 è nella scheda: Animali."}, {"prompt": "Traduci in italiano.", "focus": "豚", "options": ["maiale", "mia madre", "mio padre", "famiglia"], "answer": 0, "explanation": "豚（ぶた）= maiale."}, {"prompt": "Scegli la parola giapponese corretta.", "focus": "maiale", "options": ["豚", "母", "父", "家族"], "answer": 0, "explanation": "maiale = 豚（ぶた）."}, {"prompt": "Qual è la lettura corretta?", "focus": "豚", "options": ["ぶた", "はは", "ちち", "かぞく"], "answer": 0, "explanation": "豚 si legge ぶた."}, {"prompt": "Qual è il romaji corretto?", "focus": "豚", "options": ["buta", "haha", "chichi", "kazoku"], "answer": 0, "explanation": "豚 = buta."}, {"prompt": "A quale categoria appartiene questa parola?", "focus": "豚", "options": ["Animali", "Persone e famiglia", "Casa e oggetti", "Cibo e bevande"], "answer": 0, "explanation": "豚 è nella scheda: Animali."}, {"prompt": "Traduci in italiano.", "focus": "兎", "options": ["coniglio", "mio padre", "famiglia", "casa"], "answer": 0, "explanation": "兎（うさぎ）= coniglio."}, {"prompt": "Scegli la parola giapponese corretta.", "focus": "coniglio", "options": ["兎", "父", "家族", "家"], "answer": 0, "explanation": "coniglio = 兎（うさぎ）."}, {"prompt": "Qual è la lettura corretta?", "focus": "兎", "options": ["うさぎ", "ちち", "かぞく", "いえ"], "answer": 0, "explanation": "兎 si legge うさぎ."}, {"prompt": "Qual è il romaji corretto?", "focus": "兎", "options": ["usagi", "chichi", "kazoku", "ie"], "answer": 0, "explanation": "兎 = usagi."}, {"prompt": "A quale categoria appartiene questa parola?", "focus": "兎", "options": ["Animali", "Persone e famiglia", "Casa e oggetti", "Cibo e bevande"], "answer": 0, "explanation": "兎 è nella scheda: Animali."}, {"prompt": "Traduci in italiano.", "focus": "虫", "options": ["insetto", "famiglia", "casa", "stanza"], "answer": 0, "explanation": "虫（むし）= insetto."}, {"prompt": "Scegli la parola giapponese corretta.", "focus": "insetto", "options": ["虫", "家族", "家", "部屋"], "answer": 0, "explanation": "insetto = 虫（むし）."}, {"prompt": "Qual è la lettura corretta?", "focus": "虫", "options": ["むし", "かぞく", "いえ", "へや"], "answer": 0, "explanation": "虫 si legge むし."}, {"prompt": "Qual è il romaji corretto?", "focus": "虫", "options": ["mushi", "kazoku", "ie", "heya"], "answer": 0, "explanation": "虫 = mushi."}, {"prompt": "A quale categoria appartiene questa parola?", "focus": "虫", "options": ["Animali", "Persone e famiglia", "Casa e oggetti", "Cibo e bevande"], "answer": 0, "explanation": "虫 è nella scheda: Animali."}];
function shuffle(array) {
  const arr = [...array];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function shimaQuestionKey(item) {
  return JSON.stringify({
    prompt: item && item.prompt || '',
    focus: item && item.focus || '',
    options: item && item.options || [],
    answer: item && item.answer,
    explanation: item && item.explanation || ''
  });
}
function uniqueQuestions(pool) {
  const seen = new Set();
  return (pool || []).filter(item => {
    const key = shimaQuestionKey(item);
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}

let currentQuestions = [];
function renderQuiz() {
  currentQuestions = shuffle(uniqueQuestions(QUESTION_POOL)).slice(0, 10).map(item => {
    const options = shuffle(item.options.map((text, idx) => ({ text, originalIndex: idx })));
    return {...item, shuffledOptions: options, correctShuffledIndex: options.findIndex(o => o.originalIndex === item.answer)};
  });
  const form = document.getElementById('quizForm');
  form.innerHTML = currentQuestions.map((item, idx) => {
    const name = 'q' + idx;
    const options = item.shuffledOptions.map((choice, cidx) => `
      <label class="quiz-option">
        <input type="radio" name="${name}" value="${cidx}">
        <span>${choice.text}</span>
      </label>`).join('');
    return `
      <section class="print-section quiz-question-card">
        <h2>Domanda ${idx + 1}</h2>
        <p class="quiz-question-main">${item.prompt}</p>
        <div class="quiz-question-focus">${item.focus}</div>
        <div class="quiz-options">${options}</div>
        <div class="quiz-inline-feedback" id="fb${idx}"></div>
      </section>`;
  }).join('');
  document.getElementById('quizResult').innerHTML = '';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function checkQuiz() {
  let correct = 0;
  currentQuestions.forEach((item, idx) => {
    const picked = document.querySelector(`input[name="q${idx}"]:checked`);
    const fb = document.getElementById('fb' + idx);
    if (picked && Number(picked.value) === item.correctShuffledIndex) {
      correct++;
      fb.innerHTML = `<strong class="ok">Corretto.</strong> ${item.explanation}`;
    } else {
      fb.innerHTML = `<strong class="ko">Soluzione:</strong> ${item.shuffledOptions[item.correctShuffledIndex].text}<br>${item.explanation}`;
    }
  });
  document.getElementById('quizResult').innerHTML = `<strong>Risultato:</strong> ${correct} / 10 corrette.`;
}
document.getElementById('reloadQuizBtn').addEventListener('click', renderQuiz);
document.getElementById('checkBtn').addEventListener('click', checkQuiz);
renderQuiz();
</script>
