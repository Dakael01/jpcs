a madre", "mio padre", "famiglia"], "answer": 0, "explanation": "切符（きっぷ）= biglietto."}, {"prompt": "Scegli la parola giapponese corretta.", "focus": "biglietto", "options": ["切符", "母", "父", "家族"], "answer": 0, "explanation": "biglietto = 切符（きっぷ）."}, {"prompt": "Qual è la lettura corretta?", "focus": "切符", "options": ["きっぷ", "はは", "ちち", "かぞく"], "answer": 0, "explanation": "切符 si legge きっぷ."}, {"prompt": "Qual è il romaji corretto?", "focus": "切符", "options": ["kippu", "haha", "chichi", "kazoku"], "answer": 0, "explanation": "切符 = kippu."}, {"prompt": "A quale categoria appartiene questa parola?", "focus": "切符", "options": ["Oggetti comuni", "Persone e famiglia", "Casa e oggetti", "Cibo e bevande"], "answer": 0, "explanation": "切符 è nella scheda: Oggetti comuni."}, {"prompt": "Traduci in italiano.", "focus": "写真", "options": ["foto", "mio padre", "famiglia", "casa"], "answer": 0, "explanation": "写真（しゃしん）= foto."}, {"prompt": "Scegli la parola giapponese corretta.", "focus": "foto", "options": ["写真", "父", "家族", "家"], "answer": 0, "explanation": "foto = 写真（しゃしん）."}, {"prompt": "Qual è la lettura corretta?", "focus": "写真", "options": ["しゃしん", "ちち", "かぞく", "いえ"], "answer": 0, "explanation": "写真 si legge しゃしん."}, {"prompt": "Qual è il romaji corretto?", "focus": "写真", "options": ["shashin", "chichi", "kazoku", "ie"], "answer": 0, "explanation": "写真 = shashin."}, {"prompt": "A quale categoria appartiene questa parola?", "focus": "写真", "options": ["Oggetti comuni", "Persone e famiglia", "Casa e oggetti", "Cibo e bevande"], "answer": 0, "explanation": "写真 è nella scheda: Oggetti comuni."}, {"prompt": "Traduci in italiano.", "focus": "スマホ", "options": ["smartphone", "famiglia", "casa", "stanza"], "answer": 0, "explanation": "スマホ（スマホ）= smartphone."}, {"prompt": "Scegli la parola giapponese corretta.", "focus": "smartphone", "options": ["スマホ", "家族", "家", "部屋"], "answer": 0, "explanation": "smartphone = スマホ（スマホ）."}, {"prompt": "Qual è la lettura corretta?", "focus": "スマホ", "options": ["スマホ", "かぞく", "いえ", "へや"], "answer": 0, "explanation": "スマホ si legge スマホ."}, {"prompt": "Qual è il romaji corretto?", "focus": "スマホ", "options": ["sumaho", "kazoku", "ie", "heya"], "answer": 0, "explanation": "スマホ = sumaho."}, {"prompt": "A quale categoria appartiene questa parola?", "focus": "スマホ", "options": ["Oggetti comuni", "Persone e famiglia", "Casa e oggetti", "Cibo e bevande"], "answer": 0, "explanation": "スマホ è nella scheda: Oggetti comuni."}];
function shuffle(array) {
  const arr = [...array];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function shimaQuestionKey(item) {
  return JSON.stringify({
    prompt: item && item.prompt || '',
    focus: item && item.focus || '',
    options: item && item.options || [],
    answer: item && item.answer,
    explanation: item && item.explanation || ''
  });
}
function uniqueQuestions(pool) {
  const seen = new Set();
  return (pool || []).filter(item => {
    const key = shimaQuestionKey(item);
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}

let currentQuestions = [];
function renderQuiz() {
  currentQuestions = shuffle(uniqueQuestions(QUESTION_POOL)).slice(0, 10).map(item => {
    const options = shuffle(item.options.map((text, idx) => ({ text, originalIndex: idx })));
    return {...item, shuffledOptions: options, correctShuffledIndex: options.findIndex(o => o.originalIndex === item.answer)};
  });
  const form = document.getElementById('quizForm');
  form.innerHTML = currentQuestions.map((item, idx) => {
    const name = 'q' + idx;
    const options = item.shuffledOptions.map((choice, cidx) => `
      <label class="quiz-option">
        <input type="radio" name="${name}" value="${cidx}">
        <span>${choice.text}</span>
      </label>`).join('');
    return `
      <section class="print-section quiz-question-card">
        <h2>Domanda ${idx + 1}</h2>
        <p class="quiz-question-main">${item.prompt}</p>
        <div class="quiz-question-focus">${item.focus}</div>
        <div class="quiz-options">${options}</div>
        <div class="quiz-inline-feedback" id="fb${idx}"></div>
      </section>`;
  }).join('');
  document.getElementById('quizResult').innerHTML = '';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function checkQuiz() {
  let correct = 0;
  currentQuestions.forEach((item, idx) => {
    const picked = document.querySelector(`input[name="q${idx}"]:checked`);
    const fb = document.getElementById('fb' + idx);
    if (picked && Number(picked.value) === item.correctShuffledIndex) {
      correct++;
      fb.innerHTML = `<strong class="ok">Corretto.</strong> ${item.explanation}`;
    } else {
      fb.innerHTML = `<strong class="ko">Soluzione:</strong> ${item.shuffledOptions[item.correctShuffledIndex].text}<br>${item.explanation}`;
    }
  });
  document.getElementById('quizResult').innerHTML = `<strong>Risultato:</strong> ${correct} / 10 corrette.`;
}
document.getElementById('reloadQuizBtn').addEventListener('click', renderQuiz);
document.getElementById('checkBtn').addEventListener('click', checkQuiz);
renderQuiz();
