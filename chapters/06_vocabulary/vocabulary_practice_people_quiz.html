, "answer": 0, "explanation": "母（はは）= mia madre."}, {"prompt": "Scegli la parola giapponese corretta.", "focus": "mia madre", "options": ["母", "時計", "電話", "鍵"], "answer": 0, "explanation": "mia madre = 母（はは）."}, {"prompt": "Qual è la lettura corretta?", "focus": "母", "options": ["はは", "とけい", "でんわ", "かぎ"], "answer": 0, "explanation": "母 si legge はは."}, {"prompt": "Qual è il romaji corretto?", "focus": "母", "options": ["haha", "tokei", "denwa", "kagi"], "answer": 0, "explanation": "母 = haha."}, {"prompt": "A quale categoria appartiene questa parola?", "focus": "母", "options": ["Persone e famiglia", "Casa e oggetti", "Cibo e bevande", "Città e luoghi"], "answer": 0, "explanation": "母 è nella scheda: Persone e famiglia."}, {"prompt": "Traduci in italiano.", "focus": "父", "options": ["mio padre", "telefono", "chiave", "acqua"], "answer": 0, "explanation": "父（ちち）= mio padre."}, {"prompt": "Scegli la parola giapponese corretta.", "focus": "mio padre", "options": ["父", "電話", "鍵", "水"], "answer": 0, "explanation": "mio padre = 父（ちち）."}, {"prompt": "Qual è la lettura corretta?", "focus": "父", "options": ["ちち", "でんわ", "かぎ", "みず"], "answer": 0, "explanation": "父 si legge ちち."}, {"prompt": "Qual è il romaji corretto?", "focus": "父", "options": ["chichi", "denwa", "kagi", "mizu"], "answer": 0, "explanation": "父 = chichi."}, {"prompt": "A quale categoria appartiene questa parola?", "focus": "父", "options": ["Persone e famiglia", "Casa e oggetti", "Cibo e bevande", "Città e luoghi"], "answer": 0, "explanation": "父 è nella scheda: Persone e famiglia."}, {"prompt": "Traduci in italiano.", "focus": "家族", "options": ["famiglia", "chiave", "acqua", "tè"], "answer": 0, "explanation": "家族（かぞく）= famiglia."}, {"prompt": "Scegli la parola giapponese corretta.", "focus": "famiglia", "options": ["家族", "鍵", "水", "お茶"], "answer": 0, "explanation": "famiglia = 家族（かぞく）."}, {"prompt": "Qual è la lettura corretta?", "focus": "家族", "options": ["かぞく", "かぎ", "みず", "おちゃ"], "answer": 0, "explanation": "家 function shuffle(array) {
  const arr = [...array];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function shimaQuestionKey(item) {
  return JSON.stringify({
    prompt: item && item.prompt || '',
    focus: item && item.focus || '',
    options: item && item.options || [],
    answer: item && item.answer,
    explanation: item && item.explanation || ''
  });
}
function uniqueQuestions(pool) {
  const seen = new Set();
  return (pool || []).filter(item => {
    const key = shimaQuestionKey(item);
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}

let currentQuestions = [];
function renderQuiz() {
  currentQuestions = shuffle(uniqueQuestions(QUESTION_POOL)).slice(0, 10).map(item => {
    const options = shuffle(item.options.map((text, idx) => ({ text, originalIndex: idx })));
    return {...item, shuffledOptions: options, correctShuffledIndex: options.findIndex(o => o.originalIndex === item.answer)};
  });
  const form = document.getElementById('quizForm');
  form.innerHTML = currentQuestions.map((item, idx) => {
    const name = 'q' + idx;
    const options = item.shuffledOptions.map((choice, cidx) => `
      <label class="quiz-option">
        <input type="radio" name="${name}" value="${cidx}">
        <span>${choice.text}</span>
      </label>`).join('');
    return `
      <section class="print-section quiz-question-card">
        <h2>Domanda ${idx + 1}</h2>
        <p class="quiz-question-main">${item.prompt}</p>
        <div class="quiz-question-focus">${item.focus}</div>
        <div class="quiz-options">${options}</div>
        <div class="quiz-inline-feedback" id="fb${idx}"></div>
      </section>`;
  }).join('');
  document.getElementById('quizResult').innerHTML = '';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function checkQuiz() {
  let correct = 0;
  currentQuestions.forEach((item, idx) => {
    const picked = document.querySelector(`input[name="q${idx}"]:checked`);
    const fb = document.getElementById('fb' + idx);
    if (picked && Number(picked.value) === item.correctShuffledIndex) {
      correct++;
      fb.innerHTML = `<strong class="ok">Corretto.</strong> ${item.explanation}`;
    } else {
      fb.innerHTML = `<strong class="ko">Soluzione:</strong> ${item.shuffledOptions[item.correctShuffledIndex].text}<br>${item.explanation}`;
    }
  });
  document.getElementById('quizResult').innerHTML = `<strong>Risultato:</strong> ${correct} / 10 corrette.`;
}
document.getElementById('reloadQuizBtn').addEventListener('click', renderQuiz);
document.getElementById('checkBtn').addEventListener('click', checkQuiz);
renderQuiz();
