oria appartiene questa parola?", "focus": "耳", "options": ["Parti del corpo", "Persone e famiglia", "Casa e oggetti", "Cibo e bevande"], "answer": 0, "explanation": "耳 è nella scheda: Parti del corpo."}, {"prompt": "Traduci in italiano.", "focus": "口", "options": ["bocca", "insegnante", "studente", "mia madre"], "answer": 0, "explanation": "口（くち）= bocca."}, {"prompt": "Scegli la parola giapponese corretta.", "focus": "bocca", "options": ["口", "先生", "学生", "母"], "answer": 0, "explanation": "bocca = 口（くち）."}, {"prompt": "Qual è la lettura corretta?", "focus": "口", "options": ["くち", "せんせい", "がくせい", "はは"], "answer": 0, "explanation": "口 si legge くち."}, {"prompt": "Qual è il romaji corretto?", "focus": "口", "options": ["kuchi", "sensei", "gakusei", "haha"], "answer": 0, "explanation": "口 = kuchi."}, {"prompt": "A quale categoria appartiene questa parola?", "focus": "口", "options": ["Parti del corpo", "Persone e famiglia", "Casa e oggetti", "Cibo e bevande"], "answer": 0, "explanation": "口 è nella scheda: Parti del corpo."}, {"prompt": "Traduci in italiano.", "focus": "手", "options": ["mano", "studente", "mia madre", "mio padre"], "answer": 0, "explanation": "手（て）= mano."}, {"prompt": "Scegli la parola giapponese corretta.", "focus": "mano", "options": ["手", "学生", "母", "父"], "answer": 0, "explanation": "mano = 手（て）."}, {"prompt": "Qual è la lettura corretta?", "focus": "手", "options": ["て", "がくせい", "はは", "ちち"], "answer": 0, "explanation": "手 si legge て."}, {"prompt": "Qual è il romaji corretto?", "focus": "手", "options": ["te", "gakusei", "haha", "chichi"], "answer": 0, "explanation": "手 = te."}, {"prompt": "A quale categoria appartiene questa parola?", "focus": "手", "options": ["Parti del corpo", "Persone e famiglia", "Casa e oggetti", "Cibo e bevande"], "answer": 0, "explanation": "手 è nella scheda: Parti del corpo."}, {"prompt": "Traduci in italiano.", "focus": "足", "options": ["piede / gamba", "mia madre", "mio padre", "famiglia"], "answer": 0, "explanation": "足（あし）= piede / gamba."}, {"prompt": "Scegli la parola giapponese corretta.", "focus": "piede / gamba", "options": ["足", "母", "父", "家族"], "answer": 0, "explanation": "piede / gamba = 足（あし）."}, {"prompt": "Qual è la lettura corretta?", "focus": "足", "options": ["あし", "はは", "ちち", "かぞく"], "answer": 0, "explanation": "足 si legge あし."}, {"prompt": "Qual è il romaji corretto?", "focus": "足", "options": ["ashi", "haha", "chichi", "kazoku"], "answer": 0, "explanation": "足 = ashi."}, {"prompt": "A quale categoria appartiene questa parola?", "focus": "足", "options": ["Parti del corpo", "Persone e famiglia", "Casa e oggetti", "Cibo e bevande"], "answer": 0, "explanation": "足 è nella scheda: Parti del corpo."}, {"prompt": "Traduci in italiano.", "focus": "心", "options": ["cuore / mente", "mio padre", "famiglia", "casa"], "answer": 0, "explanation": "心（こころ）= cuore / mente."}, {"prompt": "Scegli la parola giapponese corretta.", "focus": "cuore / mente", "options": ["心", "父", "家族", "家"], "answer": 0, "explanation": "cuore / mente = 心（こころ）."}, {"prompt": "Qual è la lettura corretta?", "focus": "心", "options": ["こころ", "ちち", "かぞく", "いえ"], "answer": 0, "explanation": "心 si legge こころ."}, {"prompt": "Qual è il romaji corretto?", "focus": "心", "options": ["kokoro", "chichi", "kazoku", "ie"], "answer": 0, "explanation": "心 = kokoro."}, {"prompt": "A quale categoria appartiene questa parola?", "focus": "心", "options": ["Parti del corpo", "Persone e famiglia", "Casa e oggetti", "Cibo e bevande"], "answer": 0, "explanation": "心 è nella scheda: Parti del corpo."}, {"prompt": "Traduci in italiano.", "focus": "お腹", "options": ["pancia / stomaco", "famiglia", "casa", "stanza"], "answer": 0, "explanation": "お腹（おなか）= pancia / stomaco."}, {"prompt": "Scegli la parola giapponese corretta.", "focus": "pancia / stomaco", "options": ["お腹", "家族", "家", "部屋"], "answer": 0, "explanation": "pancia / stomaco = お腹（おなか）."}, {"prompt": "Qual è la lettura corretta?", "focus": "お腹", "options": ["おなか", "かぞく", "いえ", "へや"], function shuffle(array) {
  const arr = [...array];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function shimaQuestionKey(item) {
  return JSON.stringify({
    prompt: item && item.prompt || '',
    focus: item && item.focus || '',
    options: item && item.options || [],
    answer: item && item.answer,
    explanation: item && item.explanation || ''
  });
}
function uniqueQuestions(pool) {
  const seen = new Set();
  return (pool || []).filter(item => {
    const key = shimaQuestionKey(item);
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}

let currentQuestions = [];
function renderQuiz() {
  currentQuestions = shuffle(uniqueQuestions(QUESTION_POOL)).slice(0, 10).map(item => {
    const options = shuffle(item.options.map((text, idx) => ({ text, originalIndex: idx })));
    return {...item, shuffledOptions: options, correctShuffledIndex: options.findIndex(o => o.originalIndex === item.answer)};
  });
  const form = document.getElementById('quizForm');
  form.innerHTML = currentQuestions.map((item, idx) => {
    const name = 'q' + idx;
    const options = item.shuffledOptions.map((choice, cidx) => `
      <label class="quiz-option">
        <input type="radio" name="${name}" value="${cidx}">
        <span>${choice.text}</span>
      </label>`).join('');
    return `
      <section class="print-section quiz-question-card">
        <h2>Domanda ${idx + 1}</h2>
        <p class="quiz-question-main">${item.prompt}</p>
        <div class="quiz-question-focus">${item.focus}</div>
        <div class="quiz-options">${options}</div>
        <div class="quiz-inline-feedback" id="fb${idx}"></div>
      </section>`;
  }).join('');
  document.getElementById('quizResult').innerHTML = '';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function checkQuiz() {
  let correct = 0;
  currentQuestions.forEach((item, idx) => {
    const picked = document.querySelector(`input[name="q${idx}"]:checked`);
    const fb = document.getElementById('fb' + idx);
    if (picked && Number(picked.value) === item.correctShuffledIndex) {
      correct++;
      fb.innerHTML = `<strong class="ok">Corretto.</strong> ${item.explanation}`;
    } else {
      fb.innerHTML = `<strong class="ko">Soluzione:</strong> ${item.shuffledOptions[item.correctShuffledIndex].text}<br>${item.explanation}`;
    }
  });
  document.getElementById('quizResult').innerHTML = `<strong>Risultato:</strong> ${correct} / 10 corrette.`;
}
document.getElementById('reloadQuizBtn').addEventListener('click', renderQuiz);
document.getElementById('checkBtn').addEventListener('click', checkQuiz);
renderQuiz();
</script>
