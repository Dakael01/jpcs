ande"], "answer": 0, "explanation": "質問 è nella scheda: Scuola e studio."}, {"prompt": "Traduci in italiano.", "focus": "答え", "options": ["risposta", "mia madre", "mio padre", "famiglia"], "answer": 0, "explanation": "答え（こたえ）= risposta."}, {"prompt": "Scegli la parola giapponese corretta.", "focus": "risposta", "options": ["答え", "母", "父", "家族"], "answer": 0, "explanation": "risposta = 答え（こたえ）."}, {"prompt": "Qual è la lettura corretta?", "focus": "答え", "options": ["こたえ", "はは", "ちち", "かぞく"], "answer": 0, "explanation": "答え si legge こたえ."}, {"prompt": "Qual è il romaji corretto?", "focus": "答え", "options": ["kotae", "haha", "chichi", "kazoku"], "answer": 0, "explanation": "答え = kotae."}, {"prompt": "A quale categoria appartiene questa parola?", "focus": "答え", "options": ["Scuola e studio", "Persone e famiglia", "Casa e oggetti", "Cibo e bevande"], "answer": 0, "explanation": "答え è nella scheda: Scuola e studio."}, {"prompt": "Traduci in italiano.", "focus": "日本語", "options": ["lingua giapponese", "mio padre", "famiglia", "casa"], "answer": 0, "explanation": "日本語（にほんご）= lingua giapponese."}, {"prompt": "Scegli la parola giapponese corretta.", "focus": "lingua giapponese", "options": ["日本語", "父", "家族", "家"], "answer": 0, "explanation": "lingua giapponese = 日本語（にほんご）."}, {"prompt": "Qual è la lettura corretta?", "focus": "日本語", "options": ["にほんご", "ちち", "かぞく", "いえ"], "answer": 0, "explanation": "日本語 si legge にほんご."}, {"prompt": "Qual è il romaji corretto?", "focus": "日本語", "options": ["nihongo", "chichi", "kazoku", "ie"], "answer": 0, "explanation": "日本語 = nihongo."}, {"prompt": "A quale categoria appartiene questa parola?", "focus": "日本語", "options": ["Scuola e studio", "Persone e famiglia", "Casa e oggetti", "Cibo e bevande"], "answer": 0, "explanation": "日本語 è nella scheda: Scuola e studio."}, {"prompt": "Traduci in italiano.", "focus": "英語", "options": ["lingua inglese", "famiglia", "casa", "stanza"], "answer": 0, "explanation": "英語（えいご）= lingua inglese."}, {"prompt" function shuffle(array) {
  const arr = [...array];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function shimaQuestionKey(item) {
  return JSON.stringify({
    prompt: item && item.prompt || '',
    focus: item && item.focus || '',
    options: item && item.options || [],
    answer: item && item.answer,
    explanation: item && item.explanation || ''
  });
}
function uniqueQuestions(pool) {
  const seen = new Set();
  return (pool || []).filter(item => {
    const key = shimaQuestionKey(item);
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}

let currentQuestions = [];
function renderQuiz() {
  currentQuestions = shuffle(uniqueQuestions(QUESTION_POOL)).slice(0, 10).map(item => {
    const options = shuffle(item.options.map((text, idx) => ({ text, originalIndex: idx })));
    return {...item, shuffledOptions: options, correctShuffledIndex: options.findIndex(o => o.originalIndex === item.answer)};
  });
  const form = document.getElementById('quizForm');
  form.innerHTML = currentQuestions.map((item, idx) => {
    const name = 'q' + idx;
    const options = item.shuffledOptions.map((choice, cidx) => `
      <label class="quiz-option">
        <input type="radio" name="${name}" value="${cidx}">
        <span>${choice.text}</span>
      </label>`).join('');
    return `
      <section class="print-section quiz-question-card">
        <h2>Domanda ${idx + 1}</h2>
        <p class="quiz-question-main">${item.prompt}</p>
        <div class="quiz-question-focus">${item.focus}</div>
        <div class="quiz-options">${options}</div>
        <div class="quiz-inline-feedback" id="fb${idx}"></div>
      </section>`;
  }).join('');
  document.getElementById('quizResult').innerHTML = '';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function checkQuiz() {
  let correct = 0;
  currentQuestions.forEach((item, idx) => {
    const picked = document.querySelector(`input[name="q${idx}"]:checked`);
    const fb = document.getElementById('fb' + idx);
    if (picked && Number(picked.value) === item.correctShuffledIndex) {
      correct++;
      fb.innerHTML = `<strong class="ok">Corretto.</strong> ${item.explanation}`;
    } else {
      fb.innerHTML = `<strong class="ko">Soluzione:</strong> ${item.shuffledOptions[item.correctShuffledIndex].text}<br>${item.explanation}`;
    }
  });
  document.getElementById('quizResult').innerHTML = `<strong>Risultato:</strong> ${correct} / 10 corrette.`;
}
document.getElementById('reloadQuizBtn').addEventListener('click', renderQuiz);
document.getElementById('checkBtn').addEventListener('click', checkQuiz);
renderQuiz();
