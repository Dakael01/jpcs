"Persone e famiglia", "Casa e oggetti", "Cibo e bevande"], "answer": 0, "explanation": "風 è nella scheda: Meteo."}, {"prompt": "Traduci in italiano.", "focus": "曇り", "options": ["nuvoloso", "insegnante", "studente", "mia madre"], "answer": 0, "explanation": "曇り（くもり）= nuvoloso."}, {"prompt": "Scegli la parola giapponese corretta.", "focus": "nuvoloso", "options": ["曇り", "先生", "学生", "母"], "answer": 0, "explanation": "nuvoloso = 曇り（くもり）."}, {"prompt": "Qual è la lettura corretta?", "focus": "曇り", "options": ["くもり", "せんせい", "がくせい", "はは"], "answer": 0, "explanation": "曇り si legge くもり."}, {"prompt": "Qual è il romaji corretto?", "focus": "曇り", "options": ["kumori", "sensei", "gakusei", "haha"], "answer": 0, "explanation": "曇り = kumori."}, {"prompt": "A quale categoria appartiene questa parola?", "focus": "曇り", "options": ["Meteo", "Persone e famiglia", "Casa e oggetti", "Cibo e bevande"], "answer": 0, "explanation": "曇り è nella scheda: Meteo."}, {"prompt": "Traduci in italiano.", "focus": "暑い", "options": ["caldo", "studente", "mia madre", "mio padre"], "answer": 0, "explanation": "暑い（あつい）= caldo."}, {"prompt": "Scegli la parola giapponese corretta.", "focus": "caldo", "options": ["暑い", "学生", "母", "父"], "answer": 0, "explanation": "caldo = 暑い（あつい）."}, {"prompt": "Qual è la lettura corretta?", "focus": "暑い", "options": ["あつい", "がくせい", "はは", "ちち"], "answer": 0, "explanation": "暑い si legge あつい."}, {"prompt": "Qual è il romaji corretto?", "focus": "暑い", "options": ["atsui", "gakusei", "haha", "chichi"], "answer": 0, "explanation": "暑い = atsui."}, {"prompt": "A quale categoria appartiene questa parola?", "focus": "暑い", "options": ["Meteo", "Persone e famiglia", "Casa e oggetti", "Cibo e bevande"], "answer": 0, "explanation": "暑い è nella scheda: Meteo."}, {"prompt": "Traduci in italiano.", "focus": "寒い", "options": ["freddo", "mia madre", "mio padre", "famiglia"], "answer": 0, "explanation": "寒い（さむい）= freddo."}, {"prompt": "Scegli la parola giapponese corretta.", "focus": "freddo", "options": ["寒い", "母", "父", "家族"], "answer": 0, "explanation": "freddo = 寒い（さむい）."}, {"prompt": "Qual è la lettura corretta?", "focus": "寒い", "options": ["さむい", "はは", "ちち", "かぞく"], "answer": 0, "explanation": "寒い si legge さむい."}, {"prompt": "Qual è il romaji corretto?", "focus": "寒い", "options": ["samui", "haha", "chichi", "kazoku"], "answer": 0, "explanation": "寒い = samui."}, {"prompt": "A quale categoria appartiene questa parola?", "focus": "寒い", "options": ["Meteo", "Persone e famiglia", "Casa e oggetti", "Cibo e bevande"], "answer": 0, "explanation": "寒い è nella scheda: Meteo."}, {"prompt": "Traduci in italiano.", "focus": "涼しい", "options": ["fresco", "mio padre", "famiglia", "casa"], "answer": 0, "explanation": "涼しい（すずしい）= fresco."}, {"prompt": "Scegli la parola giapponese corretta.", "focus": "fresco", "options": ["涼しい", "父", "家族", "家"], "answer": 0, "explanation": "fresco = 涼しい（すずしい）."}, {"prompt": "Qual è la lettura corretta?", "focus": "涼しい", "options": ["すずしい", "ちち", "かぞく", "いえ"], "answer": 0, "explanation": "涼しい si legge すずしい."}, {"prompt": "Qual è il romaji corretto?", "focus": "涼しい", "options": ["suzushii", "chichi", "kazoku", "ie"], "answer": 0, "explanation": "涼しい = suzushii."}, {"prompt": "A quale categoria appartiene questa parola?", "focus": "涼しい", "options": ["Meteo", "Persone e famiglia", "Casa e oggetti", "Cibo e bevande"], "answer": 0, "explanation": "涼しい è nella scheda: Meteo."}, {"prompt": "Traduci in italiano.", "focus": "台風", "options": ["tifone", "famiglia", "casa", "stanza"], "answer": 0, "explanation": "台風（たいふう）= tifone."}, {"prompt": "Scegli la parola giapponese corretta.", "focus": "tifone", "options": ["台風", "家族", "家", "部屋"], "answer": 0, "explanation": "tifone = 台風（たいふう）."}, {"prompt": "Qual è la lettura corretta?", "focus": "台風", "options": ["たいふう", "かぞく", "いえ", "へや"], "answer": 0, "explanation": "台風 si legge たいふう."}, {"prompt": "Qual è il romaji corretto?", "focus": "台風", "options": ["taifuu", "kazoku", "ie", "heya"], "answer" function shuffle(array) {
  const arr = [...array];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function shimaQuestionKey(item) {
  return JSON.stringify({
    prompt: item && item.prompt || '',
    focus: item && item.focus || '',
    options: item && item.options || [],
    answer: item && item.answer,
    explanation: item && item.explanation || ''
  });
}
function uniqueQuestions(pool) {
  const seen = new Set();
  return (pool || []).filter(item => {
    const key = shimaQuestionKey(item);
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}

let currentQuestions = [];
function renderQuiz() {
  currentQuestions = shuffle(uniqueQuestions(QUESTION_POOL)).slice(0, 10).map(item => {
    const options = shuffle(item.options.map((text, idx) => ({ text, originalIndex: idx })));
    return {...item, shuffledOptions: options, correctShuffledIndex: options.findIndex(o => o.originalIndex === item.answer)};
  });
  const form = document.getElementById('quizForm');
  form.innerHTML = currentQuestions.map((item, idx) => {
    const name = 'q' + idx;
    const options = item.shuffledOptions.map((choice, cidx) => `
      <label class="quiz-option">
        <input type="radio" name="${name}" value="${cidx}">
        <span>${choice.text}</span>
      </label>`).join('');
    return `
      <section class="print-section quiz-question-card">
        <h2>Domanda ${idx + 1}</h2>
        <p class="quiz-question-main">${item.prompt}</p>
        <div class="quiz-question-focus">${item.focus}</div>
        <div class="quiz-options">${options}</div>
        <div class="quiz-inline-feedback" id="fb${idx}"></div>
      </section>`;
  }).join('');
  document.getElementById('quizResult').innerHTML = '';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function checkQuiz() {
  let correct = 0;
  currentQuestions.forEach((item, idx) => {
    const picked = document.querySelector(`input[name="q${idx}"]:checked`);
    const fb = document.getElementById('fb' + idx);
    if (picked && Number(picked.value) === item.correctShuffledIndex) {
      correct++;
      fb.innerHTML = `<strong class="ok">Corretto.</strong> ${item.explanation}`;
    } else {
      fb.innerHTML = `<strong class="ko">Soluzione:</strong> ${item.shuffledOptions[item.correctShuffledIndex].text}<br>${item.explanation}`;
    }
  });
  document.getElementById('quizResult').innerHTML = `<strong>Risultato:</strong> ${correct} / 10 corrette.`;
}
document.getElementById('reloadQuizBtn').addEventListener('click', renderQuiz);
document.getElementById('checkBtn').addEventListener('click', checkQuiz);
renderQuiz();
</script>
