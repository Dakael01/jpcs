getti", "Cibo e bevande"], "answer": 0, "explanation": "値段 è nella scheda: Supermercato."}, {"prompt": "Traduci in italiano.", "focus": "レジ", "options": ["cassa", "mia madre", "mio padre", "famiglia"], "answer": 0, "explanation": "レジ（レジ）= cassa."}, {"prompt": "Scegli la parola giapponese corretta.", "focus": "cassa", "options": ["レジ", "母", "父", "家族"], "answer": 0, "explanation": "cassa = レジ（レジ）."}, {"prompt": "Qual è la lettura corretta?", "focus": "レジ", "options": ["レジ", "はは", "ちち", "かぞく"], "answer": 0, "explanation": "レジ si legge レジ."}, {"prompt": "Qual è il romaji corretto?", "focus": "レジ", "options": ["reji", "haha", "chichi", "kazoku"], "answer": 0, "explanation": "レジ = reji."}, {"prompt": "A quale categoria appartiene questa parola?", "focus": "レジ", "options": ["Supermercato", "Persone e famiglia", "Casa e oggetti", "Cibo e bevande"], "answer": 0, "explanation": "レジ è nella scheda: Supermercato."}, {"prompt": "Traduci in italiano.", "focus": "袋", "options": ["sacchetto", "mio padre", "famiglia", "casa"], "answer": 0, "explanation": "袋（ふくろ）= sacchetto."}, {"prompt": "Scegli la parola giapponese corretta.", "focus": "sacchetto", "options": ["袋", "父", "家族", "家"], "answer": 0, "explanation": "sacchetto = 袋（ふくろ）."}, {"prompt": "Qual è la lettura corretta?", "focus": "袋", "options": ["ふくろ", "ちち", "かぞく", "いえ"], "answer": 0, "explanation": "袋 si legge ふくろ."}, {"prompt": "Qual è il romaji corretto?", "focus": "袋", "options": ["fukuro", "chichi", "kazoku", "ie"], "answer": 0, "explanation": "袋 = fukuro."}, {"prompt": "A quale categoria appartiene questa parola?", "focus": "袋", "options": ["Supermercato", "Persone e famiglia", "Casa e oggetti", "Cibo e bevande"], "answer": 0, "explanation": "袋 è nella scheda: Supermercato."}, {"prompt": "Traduci in italiano.", "focus": "割引", "options": ["sconto", "famiglia", "casa", "stanza"], "answer": 0, "explanation": "割引（わりびき）= sconto."}, {"prompt": "Scegli la parola giapponese corretta.", "focus": "sconto", "options": ["割引", "家族", "家", "部屋"], "answer": 0, "explanation": "sconto = 割引（わりびき）."}, {"prompt": "Qual è la lettura corretta?", "focus": "割引", "options": ["わりびき", "かぞく", "いえ", "へや"], "answer": 0, "explanation": "割引 si legge わりびき."}, {"prompt": "Qual è il romaji corretto?", "focus": "割引", "options": ["waribiki", "kazoku", "ie", "heya"], "answer": 0, "explanation": "割引 = waribiki."}, {"prompt": "A quale categoria appartiene questa parola?", "focus": "割引", "options": ["Supermercato", "Persone e famiglia", "Casa e oggetti", "Cibo e bevande"], "answer": 0, "explanation": "割引 è nella scheda: Supermercato."}];
function shuffle(array) {
  const arr = [...array];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function shimaQuestionKey(item) {
  return JSON.stringify({
    prompt: item && item.prompt || '',
    focus: item && item.focus || '',
    options: item && item.options || [],
    answer: item && item.answer,
    explanation: item && item.explanation || ''
  });
}
function uniqueQuestions(pool) {
  const seen = new Set();
  return (pool || []).filter(item => {
    const key = shimaQuestionKey(item);
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}

let currentQuestions = [];
function renderQuiz() {
  currentQuestions = shuffle(uniqueQuestions(QUESTION_POOL)).slice(0, 10).map(item => {
    const options = shuffle(item.options.map((text, idx) => ({ text, originalIndex: idx })));
    return {...item, shuffledOptions: options, correctShuffledIndex: options.findIndex(o => o.originalIndex === item.answer)};
  });
  const form = document.getElementById('quizForm');
  form.innerHTML = currentQuestions.map((item, idx) => {
    const name = 'q' + idx;
    const options = item.shuffledOptions.map((choice, cidx) => `
      <label class="quiz-option">
        <input type="radio" name="${name}" value="${cidx}">
        <span>${choice.text}</span>
      </label>`).join('');
    return `
      <section class="print-section quiz-question-card">
        <h2>Domanda ${idx + 1}</h2>
        <p class="quiz-question-main">${item.prompt}</p>
        <div class="quiz-question-focus">${item.focus}</div>
        <div class="quiz-options">${options}</div>
        <div class="quiz-inline-feedback" id="fb${idx}"></div>
      </section>`;
  }).join('');
  document.getElementById('quizResult').innerHTML = '';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function checkQuiz() {
  let correct = 0;
  currentQuestions.forEach((item, idx) => {
    const picked = document.querySelector(`input[name="q${idx}"]:checked`);
    const fb = document.getElementById('fb' + idx);
    if (picked && Number(picked.value) === item.correctShuffledIndex) {
      correct++;
      fb.innerHTML = `<strong class="ok">Corretto.</strong> ${item.explanation}`;
    } else {
      fb.innerHTML = `<strong class="ko">Soluzione:</strong> ${item.shuffledOptions[item.correctShuffledIndex].text}<br>${item.explanation}`;
    }
  });
  document.getElementById('quizResult').innerHTML = `<strong>Risultato:</strong> ${correct} / 10 corrette.`;
}
document.getElementById('reloadQuizBtn').addEventListener('click', renderQuiz);
document.getElementById('checkBtn').addEventListener('click', checkQuiz);
renderQuiz();
