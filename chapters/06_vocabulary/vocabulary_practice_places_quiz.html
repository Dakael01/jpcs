a: Città e luoghi."}, {"prompt": "Traduci in italiano.", "focus": "銀行", "options": ["banca", "mia madre", "mio padre", "famiglia"], "answer": 0, "explanation": "銀行（ぎんこう）= banca."}, {"prompt": "Scegli la parola giapponese corretta.", "focus": "banca", "options": ["銀行", "母", "父", "家族"], "answer": 0, "explanation": "banca = 銀行（ぎんこう）."}, {"prompt": "Qual è la lettura corretta?", "focus": "銀行", "options": ["ぎんこう", "はは", "ちち", "かぞく"], "answer": 0, "explanation": "銀行 si legge ぎんこう."}, {"prompt": "Qual è il romaji corretto?", "focus": "銀行", "options": ["ginkou", "haha", "chichi", "kazoku"], "answer": 0, "explanation": "銀行 = ginkou."}, {"prompt": "A quale categoria appartiene questa parola?", "focus": "銀行", "options": ["Città e luoghi", "Persone e famiglia", "Casa e oggetti", "Cibo e bevande"], "answer": 0, "explanation": "銀行 è nella scheda: Città e luoghi."}, {"prompt": "Traduci in italiano.", "focus": "郵便局", "options": ["ufficio postale", "mio padre", "famiglia", "casa"], "answer": 0, "explanation": "郵便局（ゆうびんきょく）= ufficio postale."}, {"prompt": "Scegli la parola giapponese corretta.", "focus": "ufficio postale", "options": ["郵便局", "父", "家族", "家"], "answer": 0, "explanation": "ufficio postale = 郵便局（ゆうびんきょく）."}, {"prompt": "Qual è la lettura corretta?", "focus": "郵便局", "options": ["ゆうびんきょく", "ちち", "かぞく", "いえ"], "answer": 0, "explanation": "郵便局 si legge ゆうびんきょく."}, {"prompt": "Qual è il romaji corretto?", "focus": "郵便局", "options": ["yuubinkyoku", "chichi", "kazoku", "ie"], "answer": 0, "explanation": "郵便局 = yuubinkyoku."}, {"prompt": "A quale categoria appartiene questa parola?", "focus": "郵便局", "options": ["Città e luoghi", "Persone e famiglia", "Casa e oggetti", "Cibo e bevande"], "answer": 0, "explanation": "郵便局 è nella scheda: Città e luoghi."}, {"prompt": "Traduci in italiano.", "focus": "トイレ", "options": ["bagno", "famiglia", "casa", "stanza"], "answer": 0, "explanation": "トイレ（トイレ）= bagno."}, {"prompt": "Scegli la parola giapponese corretta.", "focus": "bagno", "options": ["トイレ", "家族", "家", "部屋"], "answer": 0, "explanation": "bagno = トイレ（トイレ）."}, {"prompt": "Qual è la lettura corretta?", "focus": "トイレ", "options": ["トイレ", "かぞく", "いえ", "へや"], "answer": 0, "explanation": "トイレ si legge トイレ."}, {"prompt": "Qual è il romaji corretto?", "focus": "トイレ", "options": ["toire", "kazoku", "ie", "heya"], "answer": 0, "explanation": "トイレ = toire."}, {"prompt": "A quale categoria appartiene questa parola?", "focus": "トイレ", "options": ["Città e luoghi", "Persone e famiglia", "Casa e oggetti", "Cibo e bevande"], "answer": 0, "explanation": "トイレ è nella scheda: Città e luoghi."}];
function shuffle(array) {
  const arr = [...array];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function shimaQuestionKey(item) {
  return JSON.stringify({
    prompt: item && item.prompt || '',
    focus: item && item.focus || '',
    options: item && item.options || [],
    answer: item && item.answer,
    explanation: item && item.explanation || ''
  });
}
function uniqueQuestions(pool) {
  const seen = new Set();
  return (pool || []).filter(item => {
    const key = shimaQuestionKey(item);
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}

let currentQuestions = [];
function renderQuiz() {
  currentQuestions = shuffle(uniqueQuestions(QUESTION_POOL)).slice(0, 10).map(item => {
    const options = shuffle(item.options.map((text, idx) => ({ text, originalIndex: idx })));
    return {...item, shuffledOptions: options, correctShuffledIndex: options.findIndex(o => o.originalIndex === item.answer)};
  });
  const form = document.getElementById('quizForm');
  form.innerHTML = currentQuestions.map((item, idx) => {
    const name = 'q' + idx;
    const options = item.shuffledOptions.map((choice, cidx) => `
      <label class="quiz-option">
        <input type="radio" name="${name}" value="${cidx}">
        <span>${choice.text}</span>
      </label>`).join('');
    return `
      <section class="print-section quiz-question-card">
        <h2>Domanda ${idx + 1}</h2>
        <p class="quiz-question-main">${item.prompt}</p>
        <div class="quiz-question-focus">${item.focus}</div>
        <div class="quiz-options">${options}</div>
        <div class="quiz-inline-feedback" id="fb${idx}"></div>
      </section>`;
  }).join('');
  document.getElementById('quizResult').innerHTML = '';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function checkQuiz() {
  let correct = 0;
  currentQuestions.forEach((item, idx) => {
    const picked = document.querySelector(`input[name="q${idx}"]:checked`);
    const fb = document.getElementById('fb' + idx);
    if (picked && Number(picked.value) === item.correctShuffledIndex) {
      correct++;
      fb.innerHTML = `<strong class="ok">Corretto.</strong> ${item.explanation}`;
    } else {
      fb.innerHTML = `<strong class="ko">Soluzione:</strong> ${item.shuffledOptions[item.correctShuffledIndex].text}<br>${item.explanation}`;
    }
  });
  document.getElementById('quizResult').innerHTML = `<strong>Risultato:</strong> ${correct} / 10 corrette.`;
}
document.getElementById('reloadQuizBtn').addEventListener('click', renderQuiz);
document.getElementById('checkBtn').addEventListener('click', checkQuiz);
renderQuiz();
</script>
