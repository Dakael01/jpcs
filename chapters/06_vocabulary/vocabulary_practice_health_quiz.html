 "explanation": "風邪（かぜ）= raffreddore."}, {"prompt": "Scegli la parola giapponese corretta.", "focus": "raffreddore", "options": ["風邪", "母", "父", "家族"], "answer": 0, "explanation": "raffreddore = 風邪（かぜ）."}, {"prompt": "Qual è la lettura corretta?", "focus": "風邪", "options": ["かぜ", "はは", "ちち", "かぞく"], "answer": 0, "explanation": "風邪 si legge かぜ."}, {"prompt": "Qual è il romaji corretto?", "focus": "風邪", "options": ["kaze", "haha", "chichi", "kazoku"], "answer": 0, "explanation": "風邪 = kaze."}, {"prompt": "A quale categoria appartiene questa parola?", "focus": "風邪", "options": ["Salute", "Persone e famiglia", "Casa e oggetti", "Cibo e bevande"], "answer": 0, "explanation": "風邪 è nella scheda: Salute."}, {"prompt": "Traduci in italiano.", "focus": "怪我", "options": ["ferita / infortunio", "mio padre", "famiglia", "casa"], "answer": 0, "explanation": "怪我（けが）= ferita / infortunio."}, {"prompt": "Scegli la parola giapponese corretta.", "focus": "ferita / infortunio", "options": ["怪我", "父", "家族", "家"], "answer": 0, "explanation": "ferita / infortunio = 怪我（けが）."}, {"prompt": "Qual è la lettura corretta?", "focus": "怪我", "options": ["けが", "ちち", "かぞく", "いえ"], "answer": 0, "explanation": "怪我 si legge けが."}, {"prompt": "Qual è il romaji corretto?", "focus": "怪我", "options": ["kega", "chichi", "kazoku", "ie"], "answer": 0, "explanation": "怪我 = kega."}, {"prompt": "A quale categoria appartiene questa parola?", "focus": "怪我", "options": ["Salute", "Persone e famiglia", "Casa e oggetti", "Cibo e bevande"], "answer": 0, "explanation": "怪我 è nella scheda: Salute."}, {"prompt": "Traduci in italiano.", "focus": "痛い", "options": ["doloroso / fa male", "famiglia", "casa", "stanza"], "answer": 0, "explanation": "痛い（いたい）= doloroso / fa male."}, {"prompt": "Scegli la parola giapponese corretta.", "focus": "doloroso / fa male", "options": ["痛い", "家族", "家", "部屋"], "answer": 0, "explanation": "doloroso / fa male = 痛い（いたい）."}, {"prompt": "Qual è la lettura corretta?", "focus": "痛い", "options": ["いたい", "かぞく", "いえ", "へや"], "answer": 0, "explanation": "痛い si legge いたい."}, {"prompt": "Qual è il romaji corretto?", "focus": "痛い", "options": ["itai", "kazoku", "ie", "heya"], "answer": 0, "explanation": "痛い = itai."}, {"prompt": "A quale categoria appartiene questa parola?", "focus": "痛い", "options": ["Salute", "Persone e famiglia", "Casa e oggetti", "Cibo e bevande"], "answer": 0, "explanation": "痛い è nella scheda: Salute."}];
function shuffle(array) {
  const arr = [...array];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function shimaQuestionKey(item) {
  return JSON.stringify({
    prompt: item && item.prompt || '',
    focus: item && item.focus || '',
    options: item && item.options || [],
    answer: item && item.answer,
    explanation: item && item.explanation || ''
  });
}
function uniqueQuestions(pool) {
  const seen = new Set();
  return (pool || []).filter(item => {
    const key = shimaQuestionKey(item);
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}

let currentQuestions = [];
function renderQuiz() {
  currentQuestions = shuffle(uniqueQuestions(QUESTION_POOL)).slice(0, 10).map(item => {
    const options = shuffle(item.options.map((text, idx) => ({ text, originalIndex: idx })));
    return {...item, shuffledOptions: options, correctShuffledIndex: options.findIndex(o => o.originalIndex === item.answer)};
  });
  const form = document.getElementById('quizForm');
  form.innerHTML = currentQuestions.map((item, idx) => {
    const name = 'q' + idx;
    const options = item.shuffledOptions.map((choice, cidx) => `
      <label class="quiz-option">
        <input type="radio" name="${name}" value="${cidx}">
        <span>${choice.text}</span>
      </label>`).join('');
    return `
      <section class="print-section quiz-question-card">
        <h2>Domanda ${idx + 1}</h2>
        <p class="quiz-question-main">${item.prompt}</p>
        <div class="quiz-question-focus">${item.focus}</div>
        <div class="quiz-options">${options}</div>
        <div class="quiz-inline-feedback" id="fb${idx}"></div>
      </section>`;
  }).join('');
  document.getElementById('quizResult').innerHTML = '';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function checkQuiz() {
  let correct = 0;
  currentQuestions.forEach((item, idx) => {
    const picked = document.querySelector(`input[name="q${idx}"]:checked`);
    const fb = document.getElementById('fb' + idx);
    if (picked && Number(picked.value) === item.correctShuffledIndex) {
      correct++;
      fb.innerHTML = `<strong class="ok">Corretto.</strong> ${item.explanation}`;
    } else {
      fb.innerHTML = `<strong class="ko">Soluzione:</strong> ${item.shuffledOptions[item.correctShuffledIndex].text}<br>${item.explanation}`;
    }
  });
  document.getElementById('quizResult').innerHTML = `<strong>Risultato:</strong> ${correct} / 10 corrette.`;
}
document.getElementById('reloadQuizBtn').addEventListener('click', renderQuiz);
document.getElementById('checkBtn').addEventListener('click', checkQuiz);
renderQuiz();
</script>
