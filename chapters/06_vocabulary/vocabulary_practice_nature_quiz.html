ti", "Cibo e bevande"], "answer": 0, "explanation": "木 è nella scheda: Natura."}, {"prompt": "Traduci in italiano.", "focus": "草", "options": ["erba", "insegnante", "studente", "mia madre"], "answer": 0, "explanation": "草（くさ）= erba."}, {"prompt": "Scegli la parola giapponese corretta.", "focus": "erba", "options": ["草", "先生", "学生", "母"], "answer": 0, "explanation": "erba = 草（くさ）."}, {"prompt": "Qual è la lettura corretta?", "focus": "草", "options": ["くさ", "せんせい", "がくせい", "はは"], "answer": 0, "explanation": "草 si legge くさ."}, {"prompt": "Qual è il romaji corretto?", "focus": "草", "options": ["kusa", "sensei", "gakusei", "haha"], "answer": 0, "explanation": "草 = kusa."}, {"prompt": "A quale categoria appartiene questa parola?", "focus": "草", "options": ["Natura", "Persone e famiglia", "Casa e oggetti", "Cibo e bevande"], "answer": 0, "explanation": "草 è nella scheda: Natura."}, {"prompt": "Traduci in italiano.", "focus": "石", "options": ["pietra", "studente", "mia madre", "mio padre"], "answer": 0, "explanation": "石（いし）= pietra."}, {"prompt": "Scegli la parola giapponese corretta.", "focus": "pietra", "options": ["石", "学生", "母", "父"], "answer": 0, "explanation": "pietra = 石（いし）."}, {"prompt": "Qual è la lettura corretta?", "focus": "石", "options": ["いし", "がくせい", "はは", "ちち"], "answer": 0, "explanation": "石 si legge いし."}, {"prompt": "Qual è il romaji corretto?", "focus": "石", "options": ["ishi", "gakusei", "haha", "chichi"], "answer": 0, "explanation": "石 = ishi."}, {"prompt": "A quale categoria appartiene questa parola?", "focus": "石", "options": ["Natura", "Persone e famiglia", "Casa e oggetti", "Cibo e bevande"], "answer": 0, "explanation": "石 è nella scheda: Natura."}, {"prompt": "Traduci in italiano.", "focus": "湖", "options": ["lago", "mia madre", "mio padre", "famiglia"], "answer": 0, "explanation": "湖（みずうみ）= lago."}, {"prompt": "Scegli la parola giapponese corretta.", "focus": "lago", "options": ["湖", "母", "父", "家族"], "answer": 0, "explanation": "lago = 湖（みずうみ）. e e famiglia", "Casa e oggetti", "Cibo e bevande"], "answer": 0, "explanation": "星 è nella scheda: Natura."}];
function shuffle(array) {
  const arr = [...array];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function shimaQuestionKey(item) {
  return JSON.stringify({
    prompt: item && item.prompt || '',
    focus: item && item.focus || '',
    options: item && item.options || [],
    answer: item && item.answer,
    explanation: item && item.explanation || ''
  });
}
function uniqueQuestions(pool) {
  const seen = new Set();
  return (pool || []).filter(item => {
    const key = shimaQuestionKey(item);
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}

let currentQuestions = [];
function renderQuiz() {
  currentQuestions = shuffle(uniqueQuestions(QUESTION_POOL)).slice(0, 10).map(item => {
    const options = shuffle(item.options.map((text, idx) => ({ text, originalIndex: idx })));
    return {...item, shuffledOptions: options, correctShuffledIndex: options.findIndex(o => o.originalIndex === item.answer)};
  });
  const form = document.getElementById('quizForm');
  form.innerHTML = currentQuestions.map((item, idx) => {
    const name = 'q' + idx;
    const options = item.shuffledOptions.map((choice, cidx) => `
      <label class="quiz-option">
        <input type="radio" name="${name}" value="${cidx}">
        <span>${choice.text}</span>
      </label>`).join('');
    return `
      <section class="print-section quiz-question-card">
        <h2>Domanda ${idx + 1}</h2>
        <p class="quiz-question-main">${item.prompt}</p>
        <div class="quiz-question-focus">${item.focus}</div>
        <div class="quiz-options">${options}</div>
        <div class="quiz-inline-feedback" id="fb${idx}"></div>
      </section>`;
  }).join('');
  document.getElementById('quizResult').innerHTML = '';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function checkQuiz() {
  let correct = 0;
  currentQuestions.forEach((item, idx) => {
    const picked = document.querySelector(`input[name="q${idx}"]:checked`);
    const fb = document.getElementById('fb' + idx);
    if (picked && Number(picked.value) === item.correctShuffledIndex) {
      correct++;
      fb.innerHTML = `<strong class="ok">Corretto.</strong> ${item.explanation}`;
    } else {
      fb.innerHTML = `<strong class="ko">Soluzione:</strong> ${item.shuffledOptions[item.correctShuffledIndex].text}<br>${item.explanation}`;
    }
  });
  document.getElementById('quizResult').innerHTML = `<strong>Risultato:</strong> ${correct} / 10 corrette.`;
}
document.getElementById('reloadQuizBtn').addEventListener('click', renderQuiz);
document.getElementById('checkBtn').addEventListener('click', checkQuiz);
renderQuiz();
</script>
