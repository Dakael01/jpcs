"options": ["持ちませんでした（もちませんでした）", "持ちます（もちます）", "持ちません（もちません）", "持って（もって）"], "answer": 0, "explanation": "持つ（もつ） → 持ちませんでした（もちませんでした）."}, {"prompt": "Qual è il passato positivo cortese di 帰る（かえる）?", "options": ["帰りました（かえりました）", "帰ります（かえります）", "帰りません（かえりません）", "帰って（かえって）"], "answer": 0, "explanation": "帰る（かえる） → 帰りました（かえりました）."}, {"prompt": "Qual è il passato negativo cortese di 入る（はいる）?", "options": ["入りませんでした（はいりませんでした）", "入ります（はいります）", "入りません（はいりません）", "入って（はいって）"], "answer": 0, "explanation": "入る（はいる） → 入りませんでした（はいりませんでした）."}, {"prompt": "Qual è il passato positivo cortese di 作る（つくる）?", "options": ["作りました（つくりました）", "作ります（つくります）", "作りません（つくりません）", "作って（つくって）"], "answer": 0, "explanation": "作る（つくる） → 作りました（つくりました）."}, {"prompt": "Qual è il passato negativo cortese di 乗る（のる）?", "options": ["乗りませんでした（のりませんでした）", "乗ります（のります）", "乗りません（のりません）", "乗って（のって）"], "answer": 0, "explanation": "乗る（のる） → 乗りませんでした（のりませんでした）."}, {"prompt": "Qual è il passato positivo cortese di 売る（うる）?", "options": ["売りました（うりました）", "売ります（うります）", "売りません（うりません）", "売って（うって）"], "answer": 0, "explanation": "売る（うる） → 売りました（うりました）."}, {"prompt": "Qual è il passato negativo cortese di 切る（きる）?", "options": ["切りませんでした（きりませんでした）", "切ります（きります）", "切りません（きりません）", "切って（きって）"], "answer": 0, "explanation": "切る（きる） → 切りませんでした（きりませんでした）."}, {"prompt": "Qual è il passato positivo cortese di 分かる（わかる）?", "options": ["分かりました（わかりました）", "分かります（わかります）", "分かりません（わかりません）", "分かって（わかって）"], "answer": 0, "explanation": "分かる（わかる） → 分かりました（わかりました）."}, {"prompt": "Qual è il passato negativo cortese di 座る（すわる）?", "options": ["座りませんでした（すわりませんでした）", "座ります（すわります）", "座りません（すわりません）", "座って（すわって）"], "answer": 0, "explanation": "座る（すわる） → 座りませんでした（すわりませんでした）."}, {"prompt": "Qual è il passato positivo cortese di 立つ（たつ）?", "options": ["立ちました（たちました）", "立ちます（たちます）", "立ちません（たちません）", "立って（たって）"], "answer": 0, "explanation": "立つ（たつ） → 立ちました（たちました）."}, {"prompt": "Qual è il passato negativo cortese di 使う（つかう）?", "options": ["使いませんでした（つかいませんでした）", "使います（つかいます）", "使いません（つかいません）", "使って（つかって）"], "answer": 0, "explanation": "使う（つかう） → 使いませんでした（つかいませんでした）."}, {"prompt": "Qual è il passato positivo cortese di 洗う（あらう）?", "options": ["洗いました（あらいました）", "洗います（あらいます）", "洗いません（あらいません）", "洗って（あらって）"], "answer": 0, "explanation": "洗う（あらう） → 洗いました（あらいました）."}, {"prompt": "Qual è il passato negativo cortese di 取る（とる）?", "options": ["取りませんでした（とりませんでした）", "取ります（とります）", "取りません（とりません）", "取って（とって）"], "answer": 0, "explanation": "取る（とる） → 取りませんでした（とりませんでした）."}, {"prompt": "Qual è il passato positivo cortese di 住む（すむ）?", "options": ["住みました（すみました）", "住みます（すみます）", "住みません（すみません）", "住んで（すんで）"], "answer": 0, "explanation": "住む（すむ） → 住みました（すみました）."}, {"prompt": "Qual è il passato negativo cortese di する?", "options": ["しませんでした", "します", "しません", "して"], "answer": 0, "explanation": "する → しませんでした."}, {"prompt": "Qual è il passato positivo cortese di 勉強する（べんきょうする）?", "options": ["勉強しました（べんきょうしました）", "勉強します（べんきょうします）", "勉強しません（べんきょうしません）", "勉強して（べんきょうして）"], "answer": 0, "explanation": "勉強する（べんきょうする） → 勉強しました（べんきょうしました）."}, {"prompt": "Qual è il passato negativo cortese di 来る（くる）?", "options": ["来ませんでした（きませんでした）", "来ます（きます）", "来ません（きません）", "来て（きて）"], "answer": 0, "explanation": "来る（くる） → 来ませんでした（きませんでした）."}, {"prompt": "Qual è il passato positivo cortese di 掃除する（そうじする）?", "options": ["掃除しました（そうじしました）", "掃除します（そうじします）", "掃除しません（そうじしません）", "掃除して（そうじして）"], "answer": 0, "explanation": "掃除する（そうじする） → 掃除しました（そうじしました）."}, {"prompt": "Qual è il passato negativo cortese di 料理する（りょうりする）?", "options": ["料理しませんでした（りょうりしませんでした）", "料理します（りょうりします）", "料理しません（りょうりしません）", "料理して（りょうりして）"], "answer": 0, "explanation": "料理する（りょうりする） → 料理しませんでした（りょうりしませんでした）."}];
    const TEST_SIZE = 10;
    let currentQuestions = [];

    function shuffle(array) {
      const copy = [...array];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    
function shimaQuestionKey(item) {
  return JSON.stringify({
    prompt: item && item.prompt || '',
    focus: item && item.focus || '',
    options: item && item.options || [],
    answer: item && item.answer,
    explanation: item && item.explanation || ''
  });
}
function uniqueQuestions(pool) {
  const seen = new Set();
  return (pool || []).filter(item => {
    const key = shimaQuestionKey(item);
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}

    function startQuiz() {
      currentQuestions = shuffle(uniqueQuestions(QUESTION_BANK)).slice(0, TEST_SIZE).map(q => {
        const opts = q.options.map((text, index) => ({ text, originalIndex: index }));
        const shuffledOptions = shuffle(opts);
        return {
          ...q,
          shuffledOptions,
          correctShuffledIndex: shuffledOptions.findIndex(o => o.originalIndex === q.answer)
        };
      });
      document.getElementById('quizResult').innerHTML = '';
      renderQuiz();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderQuiz() {
      const container = document.getElementById('quizContainer');
      container.innerHTML = currentQuestions.map((q, qi) => `
        <article class="quiz-question" data-question="${qi}">
          <h2>${qi + 1}. ${q.prompt}</h2>
          <div class="quiz-options">
            ${q.shuffledOptions.map((opt, oi) => `
              <label>
                <input type="radio" name="q${qi}" value="${oi}">
                <span>${opt.text}</span>
              </label>
            `).join('')}
          </div>
          <div class="quiz-feedback"></div>
        </article>
      `).join('');
    }

    function checkQuiz() {
      let correct = 0;
      currentQuestions.forEach((q, qi) => {
        const article = document.querySelector(`.quiz-question[data-question="${qi}"]`);
        const selected = article.querySelector(`input[name="q${qi}"]:checked`);
        const feedback = article.querySelector('.quiz-feedback');
        article.classList.remove('correct','wrong','missing');

        if (!selected) {
          article.classList.add('missing');
          feedback.innerHTML = `<strong>Non risposta.</strong> Soluzione: ${q.shuffledOptions[q.correctShuffledIndex].text}<br><span>${q.explanation}</span>`;
          return;
        }

        const isCorrect = Number(selected.value) === q.correctShuffledIndex;
        if (isCorrect) {
          correct++;
          article.classList.add('correct');
          feedback.innerHTML = `<strong>Corretto.</strong><br><span>${q.explanation}</span>`;
        } else {
          article.classList.add('wrong');
          feedback.innerHTML = `<strong>Errato.</strong> Soluzione: ${q.shuffledOptions[q.correctShuffledIndex].text}<br><span>${q.explanation}</span>`;
        }
      });

      const result = document.getElementById('quizResult');
      result.innerHTML = `<strong>Punteggio: ${correct} / ${TEST_SIZE}</strong><span>${correct >= 8 ? 'Ottimo lavoro.' : correct >= 6 ? 'Buono, ma rivedi gli errori.' : 'Conviene ripassare le regole e rifare il test.'}</span>`;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    document.getElementById('checkQuiz').addEventListener('click', checkQuiz);
    document.getElementById('resetQuiz').addEventListener('click', startQuiz);
    startQuiz();
  </script>
