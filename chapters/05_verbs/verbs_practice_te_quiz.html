きく） → 聞いて（きいて）."}, {"prompt": "Qual è la forma TE di 働く（はたらく）?", "options": ["働いて（はたらいて）", "働きます（はたらきます）", "働きました（はたらきました）", "働く（はたらく）"], "answer": 0, "explanation": "働く（はたらく） → 働いて（はたらいて）."}, {"prompt": "Qual è la forma TE di 行く（いく）?", "options": ["行って（いって）", "行いて（いいて）", "行きて（いきて）", "行きます（いきます）"], "answer": 0, "explanation": "行く（いく） → 行って（いって）."}, {"prompt": "Qual è la forma TE di 話す（はなす）?", "options": ["話して（はなして）", "話します（はなします）", "話しました（はなしました）", "話す（はなす）"], "answer": 0, "explanation": "話す（はなす） → 話して（はなして）."}, {"prompt": "Qual è la forma TE di 買う（かう）?", "options": ["買って（かって）", "買います（かいます）", "買いました（かいました）", "買う（かう）"], "answer": 0, "explanation": "買う（かう） → 買って（かって）."}, {"prompt": "Qual è la forma TE di 会う（あう）?", "options": ["会って（あって）", "会います（あいます）", "会いました（あいました）", "会う（あう）"], "answer": 0, "explanation": "会う（あう） → 会って（あって）."}, {"prompt": "Qual è la forma TE di 待つ（まつ）?", "options": ["待って（まって）", "待ちます（まちます）", "待ちました（まちました）", "待つ（まつ）"], "answer": 0, "explanation": "待つ（まつ） → 待って（まって）."}, {"prompt": "Qual è la forma TE di 持つ（もつ）?", "options": ["持って（もって）", "持ちます（もちます）", "持ちました（もちました）", "持つ（もつ）"], "answer": 0, "explanation": "持つ（もつ） → 持って（もって）."}, {"prompt": "Qual è la forma TE di 帰る（かえる）?", "options": ["帰って（かえって）", "帰ります（かえります）", "帰りました（かえりました）", "帰る（かえる）"], "answer": 0, "explanation": "帰る（かえる） → 帰って（かえって）."}, {"prompt": "Qual è la forma TE di 入る（はいる）?", "options": ["入って（はいって）", "入ります（はいります）", "入りました（はいりました）", "入る（はいる）"], "answer": 0, "explanation": "入る（はいる） → 入って（はいって）."}, {"prompt": "Qual è la forma TE di 作る（つくる）?", "options": ["作って（つくって）", "作ります（つくります）", "作りました（つくりました）", "作る（つくる）"], "answer": 0, "explanation": "作る（つくる） → 作って（つくって）."}, {"prompt": "Qual è la forma TE di 乗る（のる）?", "options": ["乗って（のって）", "乗ります（のります）", "乗りました（のりました）", "乗る（のる）"], "answer": 0, "explanation": "乗る（のる） → 乗って（のって）."}, {"prompt": "Qual è la forma TE di 売る（うる）?", "options": ["売って（うって）", "売ります（うります）", "売りました（うりました）", "売る（うる）"], "answer": 0, "explanation": "売る（うる） → 売って（うって）."}, {"prompt": "Qual è la forma TE di 切る（きる）?", "options": ["切って（きって）", "切ります（きります）", "切りました（きりました）", "切る（きる）"], "answer": 0, "explanation": "切る（きる） → 切って（きって）."}, {"prompt": "Qual è la forma TE di 分かる（わかる）?", "options": ["分かって（わかって）", "分かります（わかります）", "分かりました（わかりました）", "分かる（わかる）"], "answer": 0, "explanation": "分かる（わかる） → 分かって（わかって）."}, {"prompt": "Qual è la forma TE di 座る（すわる）?", "options": ["座って（すわって）", "座ります（すわります）", "座りました（すわりました）", "座る（すわる）"], "answer": 0, "explanation": "座る（すわる） → 座って（すわって）."}, {"prompt": "Qual è la forma TE di 立つ（たつ）?", "options": ["立って（たって）", "立ちます（たちます）", "立ちました（たちました）", "立つ（たつ）"], "answer": 0, "explanation": "立つ（たつ） → 立って（たって）."}, {"prompt": "Qual è la forma TE di 使う（つかう）?", "options": ["使って（つかって）", "使います（つかいます）", "使いました（つかいました）", "使う（つかう）"], "answer": 0, "explanation": "使う（つかう） → 使って（つかって）."}, {"prompt": "Qual è la forma TE di 洗う（あらう）?", "options": ["洗って（あらって）", "洗います（あらいます）", "洗いました（あらいました）", "洗う（あらう）"], "answer": 0, "explanation": "洗う（あらう） → 洗って（あらって）."}, {"prompt": "Qual è la forma TE di 取る（とる）?", "options": ["取って（とって）", "取ります（とります）", "取りました（とりました）", "取る（とる）"], "answer": 0, "explanation": "取る（とる） → 取って（とって）."}, {"prompt": "Qual è la forma TE di 住む（すむ）?", "options": ["住んで（すんで）", "住みます（すみます）", "住みました（すみました）", "住む（すむ）"], "answer": 0, "explanation": "住む（すむ） → 住んで（すんで）."}, {"prompt": "Qual è la forma TE di する?", "options": ["して", "します", "しました", "する"], "answer": 0, "explanation": "する → して."}, {"prompt": "Qual è la forma TE di 勉強する（べんきょうする）?", "options": ["勉強して（べんきょうして）", "勉強します（べんきょうします）", "勉強しました（べんきょうしました）", "勉強する（べんきょうする）"], "answer": 0, "explanation": "勉強する（べんきょうする） → 勉強して（べんきょうして）."}, {"prompt": "Qual è la forma TE di 来る（くる）?", "options": ["来て（きて）", "来ます（きます）", "来ました（きました）", "来る（くる）"], "answer": 0, "explanation": "来る（くる） → 来て（きて）."}, {"prompt": "Qual è la forma TE di 掃除する（そうじする）?", "options": ["掃除して（そうじして）", "掃除します（そうじします）", "掃除しました（そうじしました）", "掃除する（そうじする）"], "answer": 0, "explanation": "掃除する（そうじする） → 掃除して（そうじして）."}, {"prompt": "Qual è la forma TE di 料理する（りょうりする）?", "options": ["料理して（りょうりして）", "料理します（りょうりします）", "料理しました（りょうりしました）", "料理する（りょうりする）"], "answer": 0, "explanation": "料理する（りょうりする） → 料理して（りょうりして）."}];
    const TEST_SIZE = 10;
    let currentQuestions = [];

    function shuffle(array) {
      const copy = [...array];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    
function shimaQuestionKey(item) {
  return JSON.stringify({
    prompt: item && item.prompt || '',
    focus: item && item.focus || '',
    options: item && item.options || [],
    answer: item && item.answer,
    explanation: item && item.explanation || ''
  });
}
function uniqueQuestions(pool) {
  const seen = new Set();
  return (pool || []).filter(item => {
    const key = shimaQuestionKey(item);
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}

    function startQuiz() {
      currentQuestions = shuffle(uniqueQuestions(QUESTION_BANK)).slice(0, TEST_SIZE).map(q => {
        const opts = q.options.map((text, index) => ({ text, originalIndex: index }));
        const shuffledOptions = shuffle(opts);
        return {
          ...q,
          shuffledOptions,
          correctShuffledIndex: shuffledOptions.findIndex(o => o.originalIndex === q.answer)
        };
      });
      document.getElementById('quizResult').innerHTML = '';
      renderQuiz();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderQuiz() {
      const container = document.getElementById('quizContainer');
      container.innerHTML = currentQuestions.map((q, qi) => `
        <article class="quiz-question" data-question="${qi}">
          <h2>${qi + 1}. ${q.prompt}</h2>
          <div class="quiz-options">
            ${q.shuffledOptions.map((opt, oi) => `
              <label>
                <input type="radio" name="q${qi}" value="${oi}">
                <span>${opt.text}</span>
              </label>
            `).join('')}
          </div>
          <div class="quiz-feedback"></div>
        </article>
      `).join('');
    }

    function checkQuiz() {
      let correct = 0;
      currentQuestions.forEach((q, qi) => {
        const article = document.querySelector(`.quiz-question[data-question="${qi}"]`);
        const selected = article.querySelector(`input[name="q${qi}"]:checked`);
        const feedback = article.querySelector('.quiz-feedback');
        article.classList.remove('correct','wrong','missing');

        if (!selected) {
          article.classList.add('missing');
          feedback.innerHTML = `<strong>Non risposta.</strong> Soluzione: ${q.shuffledOptions[q.correctShuffledIndex].text}<br><span>${q.explanation}</span>`;
          return;
        }

        const isCorrect = Number(selected.value) === q.correctShuffledIndex;
        if (isCorrect) {
          correct++;
          article.classList.add('correct');
          feedback.innerHTML = `<strong>Corretto.</strong><br><span>${q.explanation}</span>`;
        } else {
          article.classList.add('wrong');
          feedback.innerHTML = `<strong>Errato.</strong> Soluzione: ${q.shuffledOptions[q.correctShuffledIndex].text}<br><span>${q.explanation}</span>`;
        }
      });

      const result = document.getElementById('quizResult');
      result.innerHTML = `<strong>Punteggio: ${correct} / ${TEST_SIZE}</strong><span>${correct >= 8 ? 'Ottimo lavoro.' : correct >= 6 ? 'Buono, ma rivedi gli errori.' : 'Conviene ripassare le regole e rifare il test.'}</span>`;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    document.getElementById('checkQuiz').addEventListener('click', checkQuiz);
    document.getElementById('resetQuiz').addEventListener('click', startQuiz);
    startQuiz();
  </script>
