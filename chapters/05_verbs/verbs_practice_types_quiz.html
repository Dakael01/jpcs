options": ["U-verbo", "RU-verbo", "Irregolare", "Aggettivo"], "answer": 0, "explanation": "呼ぶ（よぶ） è un U-verbo. Significa: chiamare."}, {"prompt": "Che tipo di verbo è 泳ぐ（およぐ）?", "options": ["U-verbo", "RU-verbo", "Irregolare", "Aggettivo"], "answer": 0, "explanation": "泳ぐ（およぐ） è un U-verbo. Significa: nuotare."}, {"prompt": "Che tipo di verbo è 書く（かく）?", "options": ["U-verbo", "RU-verbo", "Irregolare", "Aggettivo"], "answer": 0, "explanation": "書く（かく） è un U-verbo. Significa: scrivere."}, {"prompt": "Che tipo di verbo è 聞く（きく）?", "options": ["U-verbo", "RU-verbo", "Irregolare", "Aggettivo"], "answer": 0, "explanation": "聞く（きく） è un U-verbo. Significa: ascoltare / chiedere."}, {"prompt": "Che tipo di verbo è 働く（はたらく）?", "options": ["U-verbo", "RU-verbo", "Irregolare", "Aggettivo"], "answer": 0, "explanation": "働く（はたらく） è un U-verbo. Significa: lavorare."}, {"prompt": "Che tipo di verbo è 行く（いく）?", "options": ["U-verbo", "RU-verbo", "Irregolare", "Aggettivo"], "answer": 0, "explanation": "行く（いく） è un U-verbo. Significa: andare."}, {"prompt": "Che tipo di verbo è 話す（はなす）?", "options": ["U-verbo", "RU-verbo", "Irregolare", "Aggettivo"], "answer": 0, "explanation": "話す（はなす） è un U-verbo. Significa: parlare."}, {"prompt": "Che tipo di verbo è 買う（かう）?", "options": ["U-verbo", "RU-verbo", "Irregolare", "Aggettivo"], "answer": 0, "explanation": "買う（かう） è un U-verbo. Significa: comprare."}, {"prompt": "Che tipo di verbo è 会う（あう）?", "options": ["U-verbo", "RU-verbo", "Irregolare", "Aggettivo"], "answer": 0, "explanation": "会う（あう） è un U-verbo. Significa: incontrare."}, {"prompt": "Che tipo di verbo è 待つ（まつ）?", "options": ["U-verbo", "RU-verbo", "Irregolare", "Aggettivo"], "answer": 0, "explanation": "待つ（まつ） è un U-verbo. Significa: aspettare."}, {"prompt": "Che tipo di verbo è 持つ（もつ）?", "options": ["U-verbo", "RU-verbo", "Irregolare", "Aggettivo"], "answer": 0, "explanation": "持つ（もつ） è un U-verbo. Significa: tenere / avere con sé."}, {"prompt": "Che tipo di verbo è 帰る（かえる）?", "options": ["U-verbo", "RU-verbo", "Irregolare", "Aggettivo"], "answer": 0, "explanation": "帰る（かえる） è un U-verbo. Significa: tornare."}, {"prompt": "Che tipo di verbo è 入る（はいる）?", "options": ["U-verbo", "RU-verbo", "Irregolare", "Aggettivo"], "answer": 0, "explanation": "入る（はいる） è un U-verbo. Significa: entrare."}, {"prompt": "Che tipo di verbo è 作る（つくる）?", "options": ["U-verbo", "RU-verbo", "Irregolare", "Aggettivo"], "answer": 0, "explanation": "作る（つくる） è un U-verbo. Significa: fare / creare."}, {"prompt": "Che tipo di verbo è 乗る（のる）?", "options": ["U-verbo", "RU-verbo", "Irregolare", "Aggettivo"], "answer": 0, "explanation": "乗る（のる） è un U-verbo. Significa: salire su un mezzo."}, {"prompt": "Che tipo di verbo è 売る（うる）?", "options": ["U-verbo", "RU-verbo", "Irregolare", "Aggettivo"], "answer": 0, "explanation": "売る（うる） è un U-verbo. Significa: vendere."}, {"prompt": "Che tipo di verbo è 切る（きる）?", "options": ["U-verbo", "RU-verbo", "Irregolare", "Aggettivo"], "answer": 0, "explanation": "切る（きる） è un U-verbo. Significa: tagliare."}, {"prompt": "Che tipo di verbo è 分かる（わかる）?", "options": ["U-verbo", "RU-verbo", "Irregolare", "Aggettivo"], "answer": 0, "explanation": "分かる（わかる） è un U-verbo. Significa: capire."}, {"prompt": "Che tipo di verbo è 座る（すわる）?", "options": ["U-verbo", "RU-verbo", "Irregolare", "Aggettivo"], "answer": 0, "explanation": "座る（すわる） è un U-verbo. Significa: sedersi."}, {"prompt": "Che tipo di verbo è 立つ（たつ）?", "options": ["U-verbo", "RU-verbo", "Irregolare", "Aggettivo"], "answer": 0, "explanation": "立つ（たつ） è un U-verbo. Significa: stare in piedi / alzarsi."}, {"prompt": "Che tipo di verbo è 使う（つかう）?", "options": ["U-verbo", "RU-verbo", "Irregolare", "Aggettivo"], "answer": 0, "explanation": "使う（つかう） è un U-verbo. Significa: usare."}, {"prompt": "Che tipo di verbo è 洗う（あらう）?", "options": ["U-verbo", "RU-verbo", "Irregolare", "Aggettivo"], "answer": 0, "explanation": "洗う（あらう） è un U-verbo. Significa: lavare."}, {"prompt": "Che tipo di verbo è 取る（とる）?", "options": ["U-verbo", "RU-verbo", "Irregolare", "Aggettivo"], "answer": 0, "explanation": "取る（とる） è un U-verbo. Significa: prendere."}, {"prompt": "Che tipo di verbo è 住む（すむ）?", "options": ["U-verbo", "RU-verbo", "Irregolare", "Aggettivo"], "answer": 0, "explanation": "住む（すむ） è un U-verbo. Significa: vivere / abitare."}, {"prompt": "Che tipo di verbo è する?", "options": ["Irregolare", "RU-verbo", "U-verbo", "Aggettivo"], "answer": 0, "explanation": "する è un Irregolare. Significa: fare."}, {"prompt": "Che tipo di verbo è 勉強する（べんきょうする）?", "options": ["Irregolare", "RU-verbo", "U-verbo", "Aggettivo"], "answer": 0, "explanation": "勉強する（べんきょうする） è un Irregolare. Significa: studiare."}, {"prompt": "Che tipo di verbo è 来る（くる）?", "options": ["Irregolare", "RU-verbo", "U-verbo", "Aggettivo"], "answer": 0, "explanation": "来る（くる） è un Irregolare. Significa: venire."}, {"prompt": "Che tipo di verbo è 掃除する（そうじする）?", "options": ["Irregolare", "RU-verbo", "U-verbo", "Aggettivo"], "answer": 0, "explanation": "掃除する（そうじする） è un Irregolare. Significa: pulire."}, {"prompt": "Che tipo di verbo è 料理する（りょうりする）?", "options": ["Irregolare", "RU-verbo", "U-verbo", "Aggettivo"], "answer": 0, "explanation": "料理する（りょうりする） è un Irregolare. Significa: cucinare."}];
    const TEST_SIZE = 10;
    let currentQuestions = [];

    function shuffle(array) {
      const copy = [...array];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    
function shimaQuestionKey(item) {
  return JSON.stringify({
    prompt: item && item.prompt || '',
    focus: item && item.focus || '',
    options: item && item.options || [],
    answer: item && item.answer,
    explanation: item && item.explanation || ''
  });
}
function uniqueQuestions(pool) {
  const seen = new Set();
  return (pool || []).filter(item => {
    const key = shimaQuestionKey(item);
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}

    function startQuiz() {
      currentQuestions = shuffle(uniqueQuestions(QUESTION_BANK)).slice(0, TEST_SIZE).map(q => {
        const opts = q.options.map((text, index) => ({ text, originalIndex: index }));
        const shuffledOptions = shuffle(opts);
        return {
          ...q,
          shuffledOptions,
          correctShuffledIndex: shuffledOptions.findIndex(o => o.originalIndex === q.answer)
        };
      });
      document.getElementById('quizResult').innerHTML = '';
      renderQuiz();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderQuiz() {
      const container = document.getElementById('quizContainer');
      container.innerHTML = currentQuestions.map((q, qi) => `
        <article class="quiz-question" data-question="${qi}">
          <h2>${qi + 1}. ${q.prompt}</h2>
          <div class="quiz-options">
            ${q.shuffledOptions.map((opt, oi) => `
              <label>
                <input type="radio" name="q${qi}" value="${oi}">
                <span>${opt.text}</span>
              </label>
            `).join('')}
          </div>
          <div class="quiz-feedback"></div>
        </article>
      `).join('');
    }

    function checkQuiz() {
      let correct = 0;
      currentQuestions.forEach((q, qi) => {
        const article = document.querySelector(`.quiz-question[data-question="${qi}"]`);
        const selected = article.querySelector(`input[name="q${qi}"]:checked`);
        const feedback = article.querySelector('.quiz-feedback');
        article.classList.remove('correct','wrong','missing');

        if (!selected) {
          article.classList.add('missing');
          feedback.innerHTML = `<strong>Non risposta.</strong> Soluzione: ${q.shuffledOptions[q.correctShuffledIndex].text}<br><span>${q.explanation}</span>`;
          return;
        }

        const isCorrect = Number(selected.value) === q.correctShuffledIndex;
        if (isCorrect) {
          correct++;
          article.classList.add('correct');
          feedback.innerHTML = `<strong>Corretto.</strong><br><span>${q.explanation}</span>`;
        } else {
          article.classList.add('wrong');
          feedback.innerHTML = `<strong>Errato.</strong> Soluzione: ${q.shuffledOptions[q.correctShuffledIndex].text}<br><span>${q.explanation}</span>`;
        }
      });

      const result = document.getElementById('quizResult');
      result.innerHTML = `<strong>Punteggio: ${correct} / ${TEST_SIZE}</strong><span>${correct >= 8 ? 'Ottimo lavoro.' : correct >= 6 ? 'Buono, ma rivedi gli errori.' : 'Conviene ripassare le regole e rifare il test.'}</span>`;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    document.getElementById('checkQuiz').addEventListener('click', checkQuiz);
    document.getElementById('resetQuiz').addEventListener('click', startQuiz);
    startQuiz();
  </script>
